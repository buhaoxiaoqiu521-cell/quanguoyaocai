<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中药材全国追踪</title>
  <style>
    :root {
      --bg: #10251f;
      --bg-deep: #0a1915;
      --paper: rgba(247, 240, 223, 0.95);
      --paper-strong: rgba(250, 244, 231, 0.98);
      --paper-soft: rgba(241, 232, 209, 0.8);
      --ink: #213127;
      --ink-soft: #5c6d61;
      --line: rgba(40, 82, 59, 0.16);
      --line-strong: rgba(40, 82, 59, 0.3);
      --green: #2f6b4e;
      --green-deep: #1d4c37;
      --gold: #b88538;
      --gold-soft: #e5c58e;
      --rose: #a85844;
      --shadow: 0 30px 80px rgba(7, 21, 16, 0.28);
      --radius-lg: 30px;
      --radius-md: 22px;
      --radius-sm: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(229, 197, 142, 0.12), transparent 24%),
        radial-gradient(circle at 85% 12%, rgba(112, 155, 122, 0.18), transparent 22%),
        linear-gradient(180deg, #112820 0%, #0d1d18 46%, #09120f 100%);
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 30px 30px;
      opacity: 0.25;
    }

    .shell {
      width: min(1260px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 56px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 20px 4px 26px;
      color: #f4ead6;
      text-align: center;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 0;
      max-width: 980px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(38px, 5vw, 64px);
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    .brand p {
      margin: 0;
      color: rgba(244, 234, 214, 0.74);
      font-size: clamp(17px, 2.2vw, 22px);
      line-height: 1.75;
      max-width: 880px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1px solid rgba(229, 197, 142, 0.2);
      background: rgba(244, 234, 214, 0.08);
      color: #f8efdb;
      font-size: 13px;
      white-space: nowrap;
    }

    .status-pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #7bb38d;
      box-shadow: 0 0 0 0 rgba(123, 179, 141, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(123, 179, 141, 0.58); }
      70% { box-shadow: 0 0 0 14px rgba(123, 179, 141, 0); }
      100% { box-shadow: 0 0 0 0 rgba(123, 179, 141, 0); }
    }

    .panel {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 247, 232, 0.14);
      box-shadow: var(--shadow);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(229, 197, 142, 0.78), transparent);
      opacity: 0.6;
      pointer-events: none;
    }

    .hero {
      display: block;
      background:
        radial-gradient(circle at 18% 12%, rgba(229, 197, 142, 0.14), transparent 24%),
        linear-gradient(135deg, rgba(18, 42, 33, 0.98), rgba(14, 30, 24, 0.98));
      margin-bottom: 22px;
    }

    .hero-copy {
      padding: 16px 24px 20px;
      color: #f6eddb;
    }

    .hero-card {
      padding: 18px 24px;
      border-radius: 28px;
      border: 1px solid rgba(247, 240, 223, 0.12);
      background: rgba(247, 240, 223, 0.05);
      max-width: 960px;
      margin: 0 auto;
      backdrop-filter: blur(10px);
    }

    .trace-entry {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      min-height: 68px;
      text-align: center;
    }

    .trace-entry-copy {
      display: grid;
      gap: 6px;
      min-width: 0;
      justify-items: center;
      text-align: center;
    }

    .trace-entry-title {
      margin: 0;
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      font-size: clamp(22px, 2.9vw, 30px);
      line-height: 1.2;
      letter-spacing: -0.03em;
    }

    .trace-entry-text {
      margin: 0;
      color: rgba(244, 234, 214, 0.74);
      font-size: 15px;
      line-height: 1.6;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 144px;
      padding: 13px 18px;
      border-radius: 999px;
      border: 1px solid rgba(247, 240, 223, 0.14);
      color: #f8efdb;
      text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      background: rgba(247, 240, 223, 0.06);
      font-size: 14px;
      font-weight: 600;
    }

    .button:hover {
      transform: translateY(-1px);
      border-color: rgba(229, 197, 142, 0.42);
      background: rgba(247, 240, 223, 0.1);
    }

    .button.primary {
      color: #1b3327;
      background: linear-gradient(135deg, #e7c789, #f6e7c7);
      border-color: transparent;
    }

    .button.trace {
      color: #fff3d6;
      border-color: rgba(229, 197, 142, 0.34);
      background: rgba(184, 133, 56, 0.16);
      min-width: 172px;
      min-height: 46px;
      padding: 11px 18px;
      font-size: 16px;
      font-weight: 700;
    }

    .global-search {
      margin-top: 20px;
    }

    .global-search-body {
      padding: 20px 22px 24px;
    }

    .global-search-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: 820px;
      margin: 0 auto 18px;
    }

    .global-search-box {
      flex: 1 1 620px;
      width: 100%;
      max-width: 620px;
      min-width: 0;
      min-height: 58px;
      background: rgba(255, 255, 255, 0.56);
      border-color: rgba(44, 78, 59, 0.12);
      padding: 0 18px;
    }

    .global-search-box span {
      color: var(--green);
      font-weight: 700;
      white-space: nowrap;
    }

    .global-search .search-input {
      color: var(--ink);
    }

    .global-search .search-input::placeholder {
      color: #89968b;
    }

    .search-submit {
      min-width: 128px;
      min-height: 58px;
      padding: 0 24px;
      border: 1px solid transparent;
      background: linear-gradient(135deg, var(--green), #47795b);
      color: #fff8eb;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .search-submit:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, #356d51, #4f8364);
    }

    .global-search-meta {
      justify-content: center;
      margin-bottom: 16px;
    }

    .global-search-mode {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .global-search-mode .filter-chip {
      min-width: 170px;
      justify-content: center;
    }

    .global-search-filters {
      display: grid;
      gap: 12px;
      justify-items: center;
      margin-bottom: 16px;
    }

    .tag.section-tag {
      color: #fff8eb;
      background: linear-gradient(135deg, var(--green), #47795b);
    }

    .source-chip,
    .filter-chip,
    .metric-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.02);
    }

    .source-chip {
      color: #eadbbd;
      border-color: rgba(247, 240, 223, 0.12);
      background: rgba(247, 240, 223, 0.05);
    }

    .section {
      margin-bottom: 20px;
      background: var(--paper);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      width: 100%;
      padding: 26px 28px 20px;
      border: 0;
      border-bottom: 1px solid rgba(44, 78, 59, 0.08);
      background: transparent;
      color: inherit;
      text-align: left;
      appearance: none;
    }

    .section-toggle {
      cursor: pointer;
      transition: background 0.18s ease;
    }

    .section-toggle:hover {
      background: rgba(47, 107, 78, 0.03);
    }

    .section-toggle:focus-visible {
      outline: 2px solid rgba(47, 107, 78, 0.24);
      outline-offset: -2px;
    }

    .section-head-main {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .section-head-side {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .section-title {
      margin: 0;
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      font-size: 30px;
      line-height: 1.2;
    }

    .section-caret {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-right: 2px solid rgba(47, 107, 78, 0.72);
      border-bottom: 2px solid rgba(47, 107, 78, 0.72);
      transform: rotate(45deg) translateY(-2px);
      transition: transform 0.18s ease;
    }

    .section-toggle[aria-expanded="false"] .section-caret {
      transform: rotate(-45deg) translateY(2px);
    }

    .count-chip {
      flex-shrink: 0;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(47, 107, 78, 0.08);
      color: var(--green-deep);
      border: 1px solid rgba(47, 107, 78, 0.14);
      font-size: 13px;
      font-weight: 700;
    }

    .section-body {
      padding: 20px 22px 26px;
    }

    .section-body[hidden] {
      display: none;
    }

    .control-grid {
      display: grid;
      grid-template-columns: minmax(240px, 1.15fr) 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border-radius: 18px;
      border: 1px solid rgba(44, 78, 59, 0.12);
      background: rgba(255, 255, 255, 0.58);
      min-height: 52px;
    }

    .search-box span {
      color: var(--green);
      font-size: 16px;
    }

    .search-input {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      outline: none;
    }

    .search-input::placeholder {
      color: #89968b;
    }

    .filter-group,
    .meta-row,
    .market-meta,
    .hotspot-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-group {
      align-items: center;
      justify-content: flex-end;
    }

    .filter-chip,
    .metric-chip {
      color: var(--ink-soft);
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      user-select: none;
    }

    .filter-chip:hover,
    .metric-chip:hover {
      transform: translateY(-1px);
      border-color: rgba(47, 107, 78, 0.28);
    }

    .filter-chip.active,
    .metric-chip.active {
      color: var(--green-deep);
      border-color: rgba(47, 107, 78, 0.28);
      background: rgba(47, 107, 78, 0.09);
    }

    .meta-row {
      margin-bottom: 16px;
    }

    .entry-list {
      display: grid;
      gap: 10px;
    }

    .entry-card {
      padding: 16px;
      border-radius: 20px;
      border: 1px solid rgba(44, 78, 59, 0.08);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.44), rgba(255, 255, 255, 0.18)),
        var(--paper-strong);
      animation: rise 0.4s ease;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .entry-top,
    .entry-title-row,
    .entry-footer,
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .entry-date {
      color: var(--ink-soft);
      font-size: 12px;
    }

    .entry-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: var(--green-deep);
      background: rgba(47, 107, 78, 0.1);
    }

    .tag.up {
      color: #8d4d2e;
      background: rgba(184, 133, 56, 0.14);
    }

    .tag.down {
      color: var(--rose);
      background: rgba(168, 88, 68, 0.12);
    }

    .entry-price {
      color: var(--gold);
      font-size: 14px;
      font-weight: 700;
    }

    .entry-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.22;
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    }

    .entry-title-button {
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: inherit;
      line-height: inherit;
      font-family: inherit;
      font-weight: inherit;
      text-align: left;
      cursor: pointer;
    }

    .entry-title-button:hover {
      color: var(--green-deep);
    }

    .entry-spec {
      color: var(--green);
      font-size: 13px;
      font-weight: 600;
    }

    .entry-meta {
      margin-top: 8px;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.65;
    }

    .entry-summary {
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 1.65;
      color: var(--ink);
    }

    .entry-price-breakdown {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .price-point {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(47, 107, 78, 0.05);
      border: 1px solid rgba(44, 78, 59, 0.1);
    }

    .price-point-label {
      color: var(--ink);
      font-size: 13px;
      line-height: 1.5;
      font-weight: 600;
    }

    .price-point-value {
      color: var(--gold);
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      white-space: nowrap;
    }

    .entry-footer {
      margin-top: 10px;
      color: var(--ink-soft);
      font-size: 12px;
    }

    .entry-link {
      color: var(--green);
      text-decoration: none;
      font-weight: 700;
    }

    .entry-link-button {
      padding: 0;
      border: 0;
      background: transparent;
      font: inherit;
      cursor: pointer;
    }

    .entry-link:hover {
      text-decoration: underline;
    }

    .entry-link-button:hover {
      text-decoration: underline;
    }

    .entry-link-list {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .hotspot-card {
      gap: 8px;
    }

    .hotspot-card .entry-top {
      margin-bottom: 2px;
    }

    .hotspot-card .entry-title-row {
      align-items: flex-start;
    }

    .hotspot-card .entry-footer {
      margin-top: 8px;
    }

    .hotspot-modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(8, 19, 15, 0.56);
      backdrop-filter: blur(6px);
    }

    .hotspot-modal[hidden] {
      display: none;
    }

    .hotspot-modal-panel {
      width: min(860px, 100%);
      max-height: min(82vh, 920px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 24px;
      border: 1px solid rgba(44, 78, 59, 0.14);
      background: var(--paper-strong);
      box-shadow: 0 30px 80px rgba(7, 21, 16, 0.34);
    }

    .hotspot-modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 24px 26px 18px;
      border-bottom: 1px solid rgba(44, 78, 59, 0.08);
    }

    .hotspot-modal-title {
      margin: 0;
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      font-size: 28px;
      line-height: 1.35;
    }

    .hotspot-modal-meta {
      margin-top: 10px;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.7;
    }

    .hotspot-modal-close {
      min-width: 84px;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(44, 78, 59, 0.14);
      background: rgba(255, 255, 255, 0.55);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    .hotspot-modal-body {
      padding: 20px 26px 24px;
      overflow-y: auto;
    }

    .hotspot-modal-text {
      color: var(--ink);
      font-size: 16px;
      line-height: 1.95;
      white-space: normal;
      word-break: break-word;
    }

    .hotspot-modal-text p {
      margin: 0 0 14px;
    }

    .hotspot-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 18px;
    }

    .delta {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(47, 107, 78, 0.08);
      color: var(--green-deep);
    }

    .delta.up {
      background: rgba(184, 133, 56, 0.14);
      color: #8d4d2e;
    }

    .delta.down {
      background: rgba(168, 88, 68, 0.12);
      color: var(--rose);
    }

    .pager {
      margin-top: 16px;
    }

    .pager-info {
      color: var(--ink-soft);
      font-size: 14px;
    }

    .pager-button {
      min-width: 112px;
      padding: 11px 15px;
      border-radius: 14px;
      border: 1px solid rgba(44, 78, 59, 0.14);
      background: rgba(255, 255, 255, 0.5);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease, border-color 0.18s ease;
    }

    .pager-button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(47, 107, 78, 0.28);
    }

    .pager-button:disabled {
      opacity: 0.36;
      cursor: not-allowed;
    }

    .market-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      justify-content: center;
    }

    .market-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1px solid rgba(44, 78, 59, 0.14);
      background: rgba(255, 255, 255, 0.52);
      color: var(--ink-soft);
      cursor: pointer;
      font: inherit;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .market-tab:hover {
      transform: translateY(-1px);
      border-color: rgba(47, 107, 78, 0.28);
    }

    .market-tab.active {
      color: #fff8eb;
      background: linear-gradient(135deg, var(--green), #47795b);
      border-color: transparent;
    }

    .market-summary {
      margin-bottom: 16px;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.85;
      text-align: center;
    }

    .empty-state {
      padding: 22px;
      border-radius: 22px;
      border: 1px dashed rgba(44, 78, 59, 0.18);
      color: var(--ink-soft);
      background: rgba(255, 255, 255, 0.38);
      font-size: 15px;
      line-height: 1.9;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 8px 6px 0;
      color: rgba(244, 234, 214, 0.8);
      font-size: 13px;
    }

    .footer-traffic {
      width: 100%;
      text-align: center;
      color: rgba(244, 234, 214, 0.88);
      font-size: 15px;
      letter-spacing: 0.02em;
    }

    .footer-disclaimer {
      width: 100%;
      margin-top: 10px;
      text-align: center;
      color: rgba(244, 234, 214, 0.74);
      font-size: 13px;
      line-height: 1.9;
      white-space: pre-line;
      word-break: break-word;
    }

    .muted {
      color: var(--ink-soft);
    }

    @media (max-width: 1024px) {
      .control-grid {
        grid-template-columns: 1fr;
      }

      .filter-group {
        justify-content: flex-start;
      }
    }

    @media (max-width: 720px) {
      .shell {
        width: min(100%, calc(100% - 18px));
        padding-top: 18px;
      }

      .topbar {
        align-items: center;

      .hero-copy,
      .hero-copy {

      .global-search-body {

      .global-search-controls {

      .global-search-mode .filter-chip {

      .global-search-filters .filter-group {
        display: grid;

        gap: 6px;

      .global-search-filters .filter-chip {
        width: 100%;

      .search-submit {

      .hero-card {

      .trace-entry {

    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <h1>中药材全国追踪</h1>
        <p>聚合产地行情、市场动态与行业快讯的一站式中药材信息情报中心。</p>
      </div>
      <div class="status-pill" id="statusPill">正在读取数据</div>
    </header>

    <section class="hero panel">
      <div class="hero-copy">
        <article class="hero-card">
          <div class="trace-entry">
            <div class="trace-entry-copy">

              <p class="trace-entry-text">药商、加工户、种植户溯源入口</p>
            </div>
            <a class="button primary trace" href="https://ahsynl.com" target="_blank" rel="noreferrer">进入平台</a>

        </article>

    </section>

    <section class="section panel" id="originSection">
      <button class="section-head section-toggle" type="button" data-section-toggle="origin" aria-expanded="false" aria-controls="originBody">
        <span class="section-head-main">

          <h2 class="section-title">产地行情</h2>
        </span>
        <span class="section-head-side">
          <span class="count-chip" id="originCountChip">今日更新 0 条</span>
        </span>
      </button>
      <div class="section-body" id="originBody" hidden>
        <div class="entry-list" id="originList"></div>
        <div class="pager">
          <button class="pager-button" id="originPrev">上一页</button>
          <div class="pager-info" id="originPageInfo">第 1 页 / 共 1 页</div>
          <button class="pager-button" id="originNext">下一页</button>

    <section class="section panel" id="marketSection">
      <button class="section-head section-toggle" type="button" data-section-toggle="market" aria-expanded="false" aria-controls="marketBody">
        <span class="section-head-main">
          <span class="section-caret" aria-hidden="true"></span>
          <h2 class="section-title">市场行情</h2>
        </span>
        <span class="section-head-side">
          <span class="count-chip" id="marketCountChip">今日更新 0 条</span>
        </span>
      </button>
      <div class="section-body" id="marketBody" hidden>
        <div class="market-tabs" id="marketTabs"></div>
        <div class="market-summary" id="marketSummary"></div>
        <div class="entry-list" id="marketList"></div>
        <div class="pager">
          <button class="pager-button" id="marketPrev">上一页</button>
          <div class="pager-info" id="marketPageInfo">第 1 页 / 共 1 页</div>
          <button class="pager-button" id="marketNext">下一页</button>

    <section class="section panel" id="hotspotSection">
      <button class="section-head section-toggle" type="button" data-section-toggle="hotspot" aria-expanded="false" aria-controls="hotspotBody">
        <span class="section-head-main">
          <span class="section-caret" aria-hidden="true"></span>
          <h2 class="section-title">行业热点</h2>
        </span>
        <span class="section-head-side">
          <span class="count-chip" id="hotspotCountChip">今日更新 0 条</span>
        </span>
      </button>
      <div class="section-body" id="hotspotBody" hidden>
        <div class="hotspot-filters" id="hotspotFilters" style="margin-bottom:16px;"></div>
        <div class="entry-list" id="hotspotList"></div>
        <div class="pager">
          <button class="pager-button" id="hotspotPrev">上一页</button>
          <div class="pager-info" id="hotspotPageInfo">第 1 页 / 共 1 页</div>
          <button class="pager-button" id="hotspotNext">下一页</button>
        </div>
      </div>
    </section>

    <section class="section panel global-search" id="searchSection">
      <button class="section-head section-toggle" type="button" data-section-toggle="search" aria-expanded="false" aria-controls="searchBody">
        <span class="section-head-main">
          <span class="section-caret" aria-hidden="true"></span>
          <h2 class="section-title">全站检索</h2>
        </span>
        <span class="section-head-side">
          <span class="count-chip" id="searchCountChip">未搜索</span>
        </span>
      </button>
      <div class="section-body global-search-body" id="searchBody" hidden>
        <div class="global-search-controls">
          <label class="search-box global-search-box">
            <span>检索</span>
            <input class="search-input" id="globalSearch" type="search" placeholder="搜索产地行情、市场行情、行业热点">
          </label>
          <button class="button search-submit" id="globalSearchSubmit" type="button">搜索</button>
        </div>
        <div class="meta-row global-search-mode" id="searchModeSwitch"></div>

      </div>

    <div class="hotspot-modal" id="hotspotModal" hidden>
      <div class="hotspot-modal-panel" role="dialog" aria-modal="true" aria-labelledby="hotspotModalTitle">
        <div class="hotspot-modal-head">
          <div>
            <h3 class="hotspot-modal-title" id="hotspotModalTitle">行业热点</h3>
            <div class="hotspot-modal-meta" id="hotspotModalMeta"></div>
          </div>
          <button class="hotspot-modal-close" id="hotspotModalClose" type="button">关闭</button>
        </div>
        <div class="hotspot-modal-body">
          <div class="hotspot-modal-text" id="hotspotModalBody"></div>

    <footer class="footer">
      <div class="footer-traffic" id="footerTraffic">本站总访问量 -- 次</div>
      <div class="footer-disclaimer">声 明：数据来自各门户网站，转载是出于传递更多信息之目的。
若有来源标注错误或侵犯了您的合法权益，请作者持权属证明与本网联系 188189694@qq.com，我们将及时更正、删除，谢谢。</div>
    </footer>
  </main>

  <script>
    const SEARCH_RENDER_LIMIT = 120;

    const state = {
      dashboard: null,
      originPage: 1,
      originPageSize: 10,
      marketPage: 1,
      marketPageSize: 10,
      hotspotPage: 1,
      hotspotPageSize: 10,
      searchQuery: "",
      searchMode: "current",
      searchHistory: {
        origin: [],
        market: [],
        hotspot: [],
      },
      searchHistoryLoaded: false,
      searchHistoryLoading: false,
      searchHistoryError: "",
      currentMarket: "",
      hotspotKind: "all",
      collapsedSections: {
        origin: true,
        market: true,
        hotspot: true,
        search: true,
      },
    };

    const sectionElements = {
      origin: { toggleId: "originSection", bodyId: "originBody" },
      market: { toggleId: "marketSection", bodyId: "marketBody" },
      hotspot: { toggleId: "hotspotSection", bodyId: "hotspotBody" },
      search: { toggleId: "searchSection", bodyId: "searchBody" },
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function safeUrl(url) {
      try {
        const parsed = new URL(url, window.location.href);
        if (parsed.hostname === "www.yt1998.com" && parsed.pathname === "/ytw/second/marketMgr/detail.jsp") {
          return "";
        }
        if (parsed.protocol === "http:" || parsed.protocol === "https:") {
          return parsed.href;
        }
      } catch (error) {
        return "";
      }
      return "";
    }

    function setSectionCollapsed(sectionKey, collapsed) {
      const body = document.getElementById(sectionElements[sectionKey]?.bodyId || "");
      const toggle = document.querySelector(`[data-section-toggle="${sectionKey}"]`);
      if (!body || !toggle) return;
      state.collapsedSections[sectionKey] = collapsed;
      body.hidden = collapsed;
      toggle.setAttribute("aria-expanded", String(!collapsed));
    }

    function toggleSection(sectionKey) {
      setSectionCollapsed(sectionKey, !state.collapsedSections[sectionKey]);
    }

    function initSectionToggles() {
      document.querySelectorAll("[data-section-toggle]").forEach((button) => {
        button.addEventListener("click", () => {
          toggleSection(button.dataset.sectionToggle);
        });
      });

      Object.keys(sectionElements).forEach((sectionKey) => {
        setSectionCollapsed(sectionKey, state.collapsedSections[sectionKey]);
      });
    }

    function tagClass(tag) {
      if (tag === "上扬" || tag === "走快") return "tag up";
      if (tag === "回落" || tag === "走缓") return "tag down";
      return "tag";
    }

    function deltaClass(value) {
      const number = Number(value);
      if (Number.isNaN(number) || !value) return "delta";
      if (number > 0) return "delta up";
      if (number < 0) return "delta down";
      return "delta";
    }

    function formatDelta(item) {
      if (!item.delta_amount && !item.delta_rate) return "";
      const amount = item.delta_amount ? `${Number(item.delta_amount) > 0 ? "+" : ""}${escapeHtml(item.delta_amount)}` : "--";
      const rate = item.delta_rate ? `${Number(item.delta_rate) > 0 ? "+" : ""}${(Number(item.delta_rate) * 100).toFixed(1)}%` : "--";
      return `<span class="${deltaClass(item.delta_amount)}">涨跌 ${amount} / ${rate}</span>`;
    }

    function renderPriceBreakdown(item) {
      const points = Array.isArray(item.price_points)
        ? item.price_points.filter((point) => point && point.label && point.price)
        : [];

      if (!points.length && !item.price) return "";

      const rows = points.length
        ? points
        : [{ label: "主流报价", price: item.price }];

      return `
        <div class="entry-price-breakdown">
          ${rows.map((point) => `
            <div class="price-point">
              <span class="price-point-label">${escapeHtml(point.label)}</span>
              <span class="price-point-value">${escapeHtml(point.price)}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderSourceLinks(item, type) {
      if (type === "hotspot") {
        return "";
      }
      const sourceLinks = Array.isArray(item.source_links)
        ? item.source_links.filter((entry) => entry && safeUrl(entry.url))
        : [];
      if (!sourceLinks.length) {
        const url = safeUrl(item.url);
        if (!url) return "";
        return `<a class="entry-link" href="${escapeHtml(url)}" target="_blank" rel="noreferrer">查看来源</a>`;
      }
      const useGenericLabel = type === "origin";
      return `
        <span class="entry-link-list">
          ${sourceLinks.map((entry, index) => `
            <a class="entry-link" href="${escapeHtml(safeUrl(entry.url))}" target="_blank" rel="noreferrer">${escapeHtml(useGenericLabel ? (sourceLinks.length > 1 ? `查看来源 ${index + 1}` : "查看来源") : (entry.label || "查看来源"))}</a>
          `).join("")}
        </span>
      `;
    }

    function renderHotspotCard(item, options = {}) {
      const sectionBadge = options.sectionLabel ? `<span class="tag section-tag">${escapeHtml(options.sectionLabel)}</span>` : "";
      const title = escapeHtml(item.title || "待补标题");
      const modalId = escapeHtml(item.id || "");
      const contentLink = `<button class="entry-link entry-link-button" type="button" data-hotspot-open="${modalId}">查看全文</button>`;

      return `
        <article class="entry-card hotspot-card">
          <div class="entry-top">
            <span class="entry-date">${escapeHtml(item.date || "--")}</span>
            <div class="entry-badges">
              ${sectionBadge}
            </div>
          </div>
          <div class="entry-title-row">
            <button class="entry-title entry-title-button" type="button" data-hotspot-open="${modalId}">${title}</button>
          </div>
          <div class="entry-footer">
            <span>来源：${escapeHtml(item.source || "中药材天地网")}</span>
            ${contentLink}
          </div>
        </article>
      `;
    }

    function renderEntryCard(item, type, options = {}) {
      if (type === "hotspot") {
        return renderHotspotCard(item, options);
      }
      const title = type === "hotspot" ? item.title : item.herb;
      const specText = type === "market"
          ? (item.spec || "")
          : (item.spec || "");
      const spec = specText ? `<span class="entry-spec">${escapeHtml(specText)}</span>` : "";
      const locationLabel = type === "origin" ? "产区" : "市场";
      const location = type === "origin" ? item.location : item.market;
      const tag = item.tag || "关注";
      const sectionBadge = options.sectionLabel ? `<span class="tag section-tag">${escapeHtml(options.sectionLabel)}</span>` : "";
      const summary = item.summary ? `<p class="entry-summary">${escapeHtml(item.summary)}</p>` : "";
      const hasPricePoints = Array.isArray(item.price_points) && item.price_points.length > 0;
      const price = type === "origin" && item.price && !hasPricePoints ? `<span class="entry-price">${escapeHtml(item.price)}</span>` : "";
      const priceBreakdown = (type === "market" || (type === "origin" && hasPricePoints)) ? renderPriceBreakdown(item) : "";
      const delta = type === "origin" && (item.delta_amount || item.delta_rate) ? formatDelta(item) : "";
      const sourceLinks = renderSourceLinks(item, type);

      return `
        <article class="entry-card">
          <div class="entry-top">
            <span class="entry-date">${escapeHtml(item.date || "--")}</span>
            <div class="entry-badges">
              ${sectionBadge}
              <span class="${type === "hotspot" ? "tag" : tagClass(tag)}">${escapeHtml(tag)}</span>
              ${price}
              ${delta}
            </div>
          </div>
          <div class="entry-title-row">
            <h3 class="entry-title">${escapeHtml(title || "待补标题")}</h3>
            ${spec}
          </div>
          <div class="entry-meta">${locationLabel}：${escapeHtml(location)}</div>
          ${priceBreakdown}
          ${summary}
          <div class="entry-footer">
            <span>来源：${escapeHtml(item.source || "待补来源")}</span>
            ${sourceLinks}
          </div>
        </article>
      `;
    }

    function renderHero(dashboard) {
      const updatedAt = dashboard?.meta?.generated_at || dashboard?.meta?.latest_date || "";
      document.getElementById("statusPill").textContent = updatedAt ? `数据更新于 ${updatedAt}` : "数据待补充";
    }

    function renderChipGroup(rootId, items, activeValue, onClick) {
      const root = document.getElementById(rootId);
      root.innerHTML = items.map((item) => `
        <button class="filter-chip ${item.value === activeValue ? "active" : ""}" data-value="${escapeHtml(item.value)}" type="button">
          ${escapeHtml(item.label)}
        </button>
      `).join("");
      root.querySelectorAll(".filter-chip").forEach((button) => {
        button.addEventListener("click", () => onClick(button.dataset.value));
      });
    }

    function matchesSearchQuery(query, parts) {
      const keyword = String(query || "").trim().toLowerCase();
      if (!keyword) return false;
      return parts.join(" ").toLowerCase().includes(keyword);
    }

    function itemSearchText(item) {
      if (item?.search_text) return String(item.search_text);
      const parts = [
        item?.title,
        item?.herb,
        item?.spec,
        item?.location,
        item?.market,
        item?.kind,
        item?.summary,
        item?.content_full,
        item?.source,
        item?.tag,
        item?.price,
      ];
      (item?.price_points || []).forEach((point) => {
        parts.push(point?.label, point?.price);
      });
      (item?.source_links || []).forEach((entry) => {
        parts.push(entry?.label);
      });
      return parts.filter(Boolean).join(" ");
    }

    function hotspotById(id) {
      const currentMatch = (state.dashboard?.hotspots?.items || []).find((item) => item.id === id);
      if (currentMatch) return currentMatch;
      return (state.searchHistory?.hotspot || []).find((item) => item.id === id);
    }

    function formatHotspotContent(text) {
      return escapeHtml(String(text || "").trim())
        .replace(/([。！？；])/g, "$1<br>")
        .replace(/([①②③④⑤⑥⑦⑧⑨⑩])/g, "<br>$1")
        .replace(/<br><br>/g, "<br>");
    }

    function openHotspotModal(id) {
      const item = hotspotById(id);
      if (!item) return;
      const modal = document.getElementById("hotspotModal");
      document.getElementById("hotspotModalTitle").textContent = item.title || "行业热点";
      document.getElementById("hotspotModalMeta").textContent = [item.date, item.source].filter(Boolean).join(" · ");
      document.getElementById("hotspotModalBody").innerHTML = formatHotspotContent(item.content_full || item.summary || "暂无正文");
      document.getElementById("hotspotModalActions").innerHTML = "";
      modal.hidden = false;
      document.body.style.overflow = "hidden";
    }

    function closeHotspotModal() {
      const modal = document.getElementById("hotspotModal");
      modal.hidden = true;
      document.body.style.overflow = "";
    }

    function filteredOriginItems() {
      if (!state.dashboard) return [];
      return state.dashboard.origin.items || [];
    }

    function latestDate(items) {
      return items
        .map((item) => item.date)
        .filter(Boolean)
        .sort()
        .reverse()[0] || "--";
    }

    function uniqueSources(items) {
      return [...new Set((items || []).map((item) => item.source).filter(Boolean))];
    }

    function renderSearchModeSwitch() {
      renderChipGroup(
        "searchModeSwitch",
        [
          { value: "current", label: "搜索最近数据" },
          { value: "history", label: "搜索历史数据" },
        ],
        state.searchMode,
        (value) => {
          void setSearchMode(value);
        }
      );
    }

    async function ensureSearchHistory() {
      if (state.searchHistoryLoaded || state.searchHistoryLoading) return;
      state.searchHistoryLoading = true;
      state.searchHistoryError = "";
      renderSearchSection(state.dashboard);
      try {
        const [originResponse, marketResponse, hotspotResponse] = await Promise.all([
          fetch("./data/origin-search-index.json"),
          fetch("./data/market-search-index.json"),
          fetch("./data/hotspot-search-index.json"),
        ]);
        if (!originResponse.ok || !marketResponse.ok || !hotspotResponse.ok) {
          throw new Error("Failed to load history search indexes.");
        }
        const [originPayload, marketPayload, hotspotPayload] = await Promise.all([
          originResponse.json(),
          marketResponse.json(),
          hotspotResponse.json(),
        ]);
        state.searchHistory = {
          origin: originPayload?.items || [],
          market: marketPayload?.items || [],
          hotspot: hotspotPayload?.items || [],
        };
        state.searchHistoryLoaded = true;
      } catch (error) {
        console.error(error);
        state.searchHistoryError = "历史检索索引加载失败，请稍后重试。";
      } finally {
        state.searchHistoryLoading = false;
        renderSearchSection(state.dashboard);
      }
    }

    async function setSearchMode(mode) {
      if (!mode || state.searchMode === mode) return;
      state.searchMode = mode;
      renderSearchSection(state.dashboard);
      if (mode === "history") {
        await ensureSearchHistory();
      }
    }

    function currentSearchCollections() {
      return {
        origin: state.dashboard?.origin?.items || [],
        market: (state.dashboard?.markets?.groups || []).flatMap((group) => group.items || []),
        hotspot: state.dashboard?.hotspots?.items || [],
      };
    }

    function historySearchCollections() {
      return {
        origin: state.searchHistory?.origin || [],
        market: state.searchHistory?.market || [],
        hotspot: state.searchHistory?.hotspot || [],
      };
    }

    function collectSearchResults() {
      if (!state.dashboard) return [];
      const query = state.searchQuery;
      if (!query.trim()) return [];
      if (state.searchMode === "history" && !state.searchHistoryLoaded) return [];

      const results = [];
      const collections = state.searchMode === "history" ? historySearchCollections() : currentSearchCollections();
      const pushMatches = (items, type, sectionLabel) => {
        (items || []).forEach((item) => {
          const matched = matchesSearchQuery(query, [itemSearchText(item)]);
          if (query.trim() && !matched) return;
          results.push({
            ...item,
            _searchType: type,
            _searchSection: sectionLabel,
          });
        });
      };

      pushMatches(collections.origin, "origin", "产地行情");
      pushMatches(collections.market, "market", "市场行情");
      pushMatches(collections.hotspot, "hotspot", "行业热点");

      return results.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
    }

    async function applySearch() {
      const input = document.getElementById("globalSearch");
      state.searchQuery = input ? input.value : "";
      if (state.searchMode === "history") {
        await ensureSearchHistory();
      }
      renderSearchSection(state.dashboard);
    }

    function renderOriginSection(dashboard) {
      const allItems = filteredOriginItems();
      const totalPages = Math.max(1, Math.ceil(allItems.length / state.originPageSize));
      if (state.originPage > totalPages) state.originPage = totalPages;
      const start = (state.originPage - 1) * state.originPageSize;
      const pageItems = allItems.slice(start, start + state.originPageSize);

      document.getElementById("originCountChip").textContent = `今日更新 ${dashboard.origin.latest_count || 0} 条`;

      const root = document.getElementById("originList");
      root.innerHTML = pageItems.length
        ? pageItems.map((item) => renderEntryCard(item, "origin")).join("")
        : `<div class="empty-state">${escapeHtml(dashboard.origin.empty_text)}</div>`;

      document.getElementById("originPageInfo").textContent = `第 ${state.originPage} 页 / 共 ${totalPages} 页`;
      document.getElementById("originPrev").disabled = state.originPage === 1;
      document.getElementById("originNext").disabled = state.originPage === totalPages;
    }

    function renderMarketSection(dashboard) {
      const groups = dashboard.markets.groups || [];
      const targetMarkets = ["亳州", "安国", "玉林"];
      const tabs = targetMarkets.map((name) => {
        const group = groups.find((item) => item.name === name);
        return {
          name,
          items: group?.items || [],
        };
      });
      const totalMatches = tabs.reduce((sum, group) => sum + group.items.length, 0);

      if (!tabs.find((group) => group.name === state.currentMarket)) {
        state.currentMarket = tabs.find((group) => group.items.length)?.name || tabs[0]?.name || "";
      }

      const currentGroup = tabs.find((group) => group.name === state.currentMarket) || tabs[0];

      document.getElementById("marketCountChip").textContent = `今日更新 ${dashboard.markets.latest_count || 0} 条`;
      document.getElementById("marketTabs").innerHTML = tabs.map((group) => `
        <button class="market-tab ${group.name === state.currentMarket ? "active" : ""}" type="button" data-market="${escapeHtml(group.name)}">
          ${escapeHtml(group.name)}市场
        </button>
      `).join("");

      document.querySelectorAll(".market-tab").forEach((button) => {
        button.addEventListener("click", () => {
          state.currentMarket = button.dataset.market;
          state.marketPage = 1;
          renderMarketSection(state.dashboard);
        });
      });

      const summary = document.getElementById("marketSummary");
      const list = document.getElementById("marketList");
      const currentItems = currentGroup?.items || [];

      if (!currentGroup || !currentItems.length) {
        summary.textContent = `${state.currentMarket || "该市场"}市场当前还没有录入到真实记录。`;
        list.innerHTML = `<div class="empty-state">${escapeHtml(String(dashboard.markets.empty_text || "").replace(/天天行情/g, "市场行情"))}</div>`;
        document.getElementById("marketPageInfo").textContent = "第 1 页 / 共 1 页";
        document.getElementById("marketPrev").disabled = true;
        document.getElementById("marketNext").disabled = true;
        return;
      }

      const totalPages = Math.max(1, Math.ceil(currentItems.length / state.marketPageSize));
      if (state.marketPage > totalPages) state.marketPage = totalPages;
      const start = (state.marketPage - 1) * state.marketPageSize;
      const pageItems = currentItems.slice(start, start + state.marketPageSize);

      summary.innerHTML = `${escapeHtml(currentGroup.name)}市场当前共 ${escapeHtml(currentItems.length)} 条记录，最新日期为 ${escapeHtml(latestDate(currentItems))}。${uniqueSources(currentItems).length ? ` 来源结构：${escapeHtml(uniqueSources(currentItems).join(" / "))}` : ""}`;
      list.innerHTML = pageItems.map((item) => renderEntryCard(item, "market")).join("");
      document.getElementById("marketPageInfo").textContent = `第 ${state.marketPage} 页 / 共 ${totalPages} 页`;
      document.getElementById("marketPrev").disabled = state.marketPage === 1;
      document.getElementById("marketNext").disabled = state.marketPage === totalPages;
    }

    function renderHotspotSection(dashboard) {
      const items = (dashboard.hotspots.items || []).filter((item) => state.hotspotKind === "all" || item.kind === state.hotspotKind);
      document.getElementById("hotspotCountChip").textContent = `今日更新 ${dashboard.hotspots.latest_count || 0} 条`;

      const hotspotFilterRoot = document.getElementById("hotspotFilters");
      const kindOptions = dashboard.hotspots.kind_options || [];
      if (kindOptions.length > 1) {
        hotspotFilterRoot.style.display = "";
        renderChipGroup(
          "hotspotFilters",
          [{ value: "all", label: "全部类型" }, ...kindOptions.map((value) => ({ value, label: value }))],
          state.hotspotKind,
          (value) => {
            state.hotspotKind = value;
            state.hotspotPage = 1;
            renderHotspotSection(state.dashboard);
          }
        );
      } else {
        hotspotFilterRoot.style.display = "none";
        hotspotFilterRoot.innerHTML = "";
        state.hotspotKind = "all";
      }

      const totalPages = Math.max(1, Math.ceil(items.length / state.hotspotPageSize));
      if (state.hotspotPage > totalPages) state.hotspotPage = totalPages;
      const start = (state.hotspotPage - 1) * state.hotspotPageSize;
      const pageItems = items.slice(start, start + state.hotspotPageSize);

      document.getElementById("hotspotList").innerHTML = items.length
        ? pageItems.map((item) => renderEntryCard(item, "hotspot")).join("")
        : `<div class="empty-state">${escapeHtml(dashboard.hotspots.empty_text)}</div>`;
      document.getElementById("hotspotPageInfo").textContent = `第 ${state.hotspotPage} 页 / 共 ${totalPages} 页`;
      document.getElementById("hotspotPrev").disabled = state.hotspotPage === 1;
      document.getElementById("hotspotNext").disabled = state.hotspotPage === totalPages || items.length === 0;
    }

    function renderSearchSection(dashboard) {
      const query = state.searchQuery.trim();
      const results = collectSearchResults();
      const root = document.getElementById("searchList");
      const meta = document.getElementById("searchMeta");
      const countChip = document.getElementById("searchCountChip");
      renderSearchModeSwitch();

      if (state.searchMode === "history" && state.searchHistoryLoading) {
        countChip.textContent = "加载中";
        meta.innerHTML = `<span class="metric-chip active">正在加载历史检索索引</span>`;
        root.innerHTML = `<div class="empty-state">正在加载历史检索索引，请稍候。</div>`;
        return;
      }

      if (state.searchMode === "history" && state.searchHistoryError) {
        countChip.textContent = "加载失败";
        meta.innerHTML = "";
        root.innerHTML = `<div class="empty-state">${escapeHtml(state.searchHistoryError)}</div>`;
        return;
      }

      if (!query) {
        countChip.textContent = "未搜索";
        meta.innerHTML = "";
        root.innerHTML = `<div class="empty-state">${
          state.searchMode === "history"
            ? "输入关键词后，可在这里搜索产地行情、市场行情和行业热点的历史数据。"
            : "输入关键词后，可在这里集中查看最近展示的产地行情、市场行情和行业热点内容。"
        }</div>`;
        return;
      }

      const originCount = results.filter((item) => item._searchSection === "产地行情").length;
      const marketCount = results.filter((item) => item._searchSection === "市场行情").length;
      const hotspotCount = results.filter((item) => item._searchSection === "行业热点").length;
      const renderedResults = results.slice(0, SEARCH_RENDER_LIMIT);

      countChip.textContent = `${results.length} 条`;
      meta.innerHTML = [
        `<span class="metric-chip active">关键词：${escapeHtml(query)}</span>`,
        `<span class="metric-chip">产地行情 ${originCount} 条</span>`,
        `<span class="metric-chip">市场行情 ${marketCount} 条</span>`,
        `<span class="metric-chip">行业热点 ${hotspotCount} 条</span>`,
        results.length > SEARCH_RENDER_LIMIT ? `<span class="metric-chip">当前仅显示前 ${SEARCH_RENDER_LIMIT} 条</span>` : "",
      ].filter(Boolean).join("");

      root.innerHTML = results.length
        ? renderedResults.map((item) => renderEntryCard(item, item._searchType, { sectionLabel: item._searchSection })).join("")
        : `<div class="empty-state">没有找到符合当前检索条件的内容。</div>`;
    }

    function renderFailure(message) {
      document.getElementById("statusPill").textContent = "数据加载失败";
      document.getElementById("originList").innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
      document.getElementById("marketList").innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
      document.getElementById("hotspotList").innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
      document.getElementById("searchList").innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
    }

    async function loadSiteVisits() {
      const footerTraffic = document.getElementById("footerTraffic");
      try {
        const response = await fetch("https://bsz.saop.cc/api", {
          method: "POST",
          credentials: "include",
          headers: {
            "x-bsz-referer": `${window.location.origin}/`,
          },
        });
        if (!response.ok) throw new Error(`Failed to load site visits: ${response.status}`);
        const payload = await response.json();
        if (!payload.success || !payload.data) throw new Error("Invalid site visits payload");
        footerTraffic.textContent = `本站总访问量 ${Number(payload.data.site_pv || 0).toLocaleString("zh-CN")} 次`;
      } catch (error) {
        console.error(error);
        footerTraffic.textContent = "本站总访问量 -- 次";
      }
    }

    async function loadDashboard() {
      try {
        const response = await fetch("./data/dashboard.json");
        if (!response.ok) throw new Error(`Failed to load dashboard.json: ${response.status}`);
        state.dashboard = await response.json();
        state.currentMarket = (state.dashboard.markets.groups || []).find((group) => group.count > 0)?.name || "";
        renderHero(state.dashboard);
        renderOriginSection(state.dashboard);
        renderMarketSection(state.dashboard);
        renderHotspotSection(state.dashboard);
        renderSearchSection(state.dashboard);

        document.getElementById("globalSearch").addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            void applySearch();
          }
        });

        document.getElementById("globalSearchSubmit").addEventListener("click", () => {
          void applySearch();
        });

        document.addEventListener("click", (event) => {
          const trigger = event.target.closest("[data-hotspot-open]");
          if (trigger) {
            openHotspotModal(trigger.getAttribute("data-hotspot-open"));
            return;
          }
          const modal = document.getElementById("hotspotModal");
          if (!modal.hidden && event.target === modal) {
            closeHotspotModal();
          }
        });

        document.getElementById("hotspotModalClose").addEventListener("click", () => {
          closeHotspotModal();
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !document.getElementById("hotspotModal").hidden) {
            closeHotspotModal();
          }
        });

        document.getElementById("originPrev").addEventListener("click", () => {
          if (state.originPage > 1) {
            state.originPage -= 1;
            renderOriginSection(state.dashboard);
          }
        });

        document.getElementById("originNext").addEventListener("click", () => {
          const totalPages = Math.max(1, Math.ceil(filteredOriginItems().length / state.originPageSize));
          if (state.originPage < totalPages) {
            state.originPage += 1;
            renderOriginSection(state.dashboard);
          }
        });

        document.getElementById("marketPrev").addEventListener("click", () => {
          if (state.marketPage > 1) {
            state.marketPage -= 1;
            renderMarketSection(state.dashboard);
          }
        });

        document.getElementById("marketNext").addEventListener("click", () => {
          const groups = state.dashboard.markets.groups || [];
          const currentGroup = groups.find((group) => group.name === state.currentMarket) || groups[0] || { items: [] };
          const totalPages = Math.max(1, Math.ceil((currentGroup.items || []).length / state.marketPageSize));
          if (state.marketPage < totalPages) {
            state.marketPage += 1;
            renderMarketSection(state.dashboard);
          }
        });

        document.getElementById("hotspotPrev").addEventListener("click", () => {
          if (state.hotspotPage > 1) {
            state.hotspotPage -= 1;
            renderHotspotSection(state.dashboard);
          }
        });

        document.getElementById("hotspotNext").addEventListener("click", () => {
          const items = (state.dashboard.hotspots.items || []).filter((item) => state.hotspotKind === "all" || item.kind === state.hotspotKind);
          const totalPages = Math.max(1, Math.ceil(items.length / state.hotspotPageSize));
          if (state.hotspotPage < totalPages) {
            state.hotspotPage += 1;
            renderHotspotSection(state.dashboard);
          }
        });
      } catch (error) {
        console.error(error);
        renderFailure("当前没有读到 dashboard.json，请先运行数据生成脚本。");
      }
    }

    initSectionToggles();
    loadSiteVisits();
    loadDashboard();
  </script>
</body>
</html>
