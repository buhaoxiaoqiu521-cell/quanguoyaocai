<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国中药材信息</title>
  <meta name="description" content="查看中药材产地行情、天天行情和行业热点。">
  <meta name="theme-color" content="#17362e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="全国中药材信息">
  <link rel="manifest" href="/manifest.webmanifest?v=yczz-v20260403">
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/yczz-v20260403-favicon-64.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/yczz-v20260403-192.png">
  <link rel="shortcut icon" href="/icons/yczz-v20260403-favicon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/yczz-v20260403-apple-touch-180.png">
  <style>
    :root {
      --bg: #17382f;
      --bg-deep: #10251f;
      --paper: rgba(249, 245, 236, 0.965);
      --paper-strong: rgba(254, 250, 243, 0.988);
      --paper-soft: rgba(240, 234, 220, 0.82);
      --ink: #223228;
      --ink-soft: #65786d;
      --line: rgba(36, 78, 58, 0.12);
      --line-strong: rgba(36, 78, 58, 0.24);
      --green: #4f8469;
      --green-deep: #27483b;
      --gold: #be9151;
      --gold-soft: #dcc698;
      --rose: #a85844;
      --shadow: 0 22px 54px rgba(9, 23, 18, 0.14);
      --radius-lg: 28px;
      --radius-md: 20px;
      --radius-sm: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(221, 191, 133, 0.08), transparent 24%),
        radial-gradient(circle at 82% 10%, rgba(133, 174, 150, 0.12), transparent 24%),
        radial-gradient(circle at 50% 100%, rgba(82, 130, 109, 0.14), transparent 34%),
        linear-gradient(180deg, #183b31 0%, #143128 45%, #0f241e 100%);
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
      background-size: 42px 42px;
      opacity: 0.1;
    }

    .shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 68px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 16px 4px 18px;
      color: #f4ead6;
      text-align: center;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 0;
      max-width: 860px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(46px, 5vw, 68px);
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      letter-spacing: -0.05em;
      font-weight: 700;
      line-height: 0.96;
      text-wrap: balance;
      text-shadow: 0 8px 28px rgba(7, 19, 15, 0.18);
    }

    .brand p {
      margin: 0;
      color: rgba(244, 234, 214, 0.64);
      font-size: clamp(15px, 1.6vw, 18px);
      line-height: 1.82;
      max-width: 680px;
      text-wrap: balance;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 15px;
      border-radius: 999px;
      border: 1px solid rgba(229, 197, 142, 0.16);
      background: linear-gradient(180deg, rgba(248, 241, 226, 0.07), rgba(240, 231, 211, 0.04));
      color: rgba(248, 239, 219, 0.88);
      font-size: 11.5px;
      white-space: nowrap;
      box-shadow:
        inset 0 1px 0 rgba(255, 248, 233, 0.06),
        0 10px 24px rgba(8, 20, 16, 0.1);
    }

    .status-pill::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #7bb38d;
      box-shadow: 0 0 0 0 rgba(123, 179, 141, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(123, 179, 141, 0.58); }
      70% { box-shadow: 0 0 0 14px rgba(123, 179, 141, 0); }
      100% { box-shadow: 0 0 0 0 rgba(123, 179, 141, 0); }
    }

    .panel {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 247, 232, 0.13);
      box-shadow: var(--shadow);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(229, 197, 142, 0.78), transparent);
      opacity: 0.6;
      pointer-events: none;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 144px;
      padding: 13px 18px;
      border-radius: 999px;
      border: 1px solid rgba(247, 240, 223, 0.14);
      color: #f8efdb;
      text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      background: rgba(247, 240, 223, 0.06);
      font-size: 14px;
      font-weight: 600;
    }

    .button:hover {
      transform: translateY(-1px);
      border-color: rgba(229, 197, 142, 0.42);
      background: rgba(247, 240, 223, 0.1);
    }

    .global-search {
      margin-top: 20px;
    }

    .global-search-body {
      padding: 20px 22px 24px;
    }

    .global-search-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: 820px;
      margin: 0 auto 18px;
    }

    .global-search-box {
      flex: 1 1 620px;
      width: 100%;
      max-width: 620px;
      min-width: 0;
      min-height: 58px;
      background: rgba(255, 255, 255, 0.56);
      border-color: rgba(44, 78, 59, 0.12);
      padding: 0 18px;
    }

    .global-search-box span {
      color: var(--green);
      font-weight: 700;
      white-space: nowrap;
    }

    .global-search .search-input {
      color: var(--ink);
    }

    .global-search .search-input::placeholder {
      color: #89968b;
    }

    .search-submit {
      min-width: 128px;
      min-height: 58px;
      padding: 0 24px;
      border: 1px solid transparent;
      background: linear-gradient(135deg, var(--green), #47795b);
      color: #fff8eb;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .search-submit:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, #356d51, #4f8364);
    }

    .global-search-meta {
      justify-content: center;
      margin-bottom: 16px;
    }

    .global-search-mode {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .global-search-mode .filter-chip {
      min-width: 170px;
      justify-content: center;
    }

    .global-search-filters {
      display: grid;
      gap: 12px;
      justify-items: center;
      margin-bottom: 16px;
    }

    .tag.section-tag {
      color: #fff8eb;
      background: linear-gradient(135deg, var(--green), #47795b);
    }

    .source-chip,
    .filter-chip,
    .metric-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.02);
    }

    .source-chip {
      color: #eadbbd;
      border-color: rgba(247, 240, 223, 0.12);
      background: rgba(247, 240, 223, 0.05);
    }

    .section {
      margin-bottom: 18px;
      border-color: rgba(214, 202, 177, 0.34);
      background: linear-gradient(180deg, rgba(253, 249, 241, 0.988), rgba(245, 239, 226, 0.95));
      box-shadow:
        0 14px 34px rgba(8, 20, 16, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.76);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      padding: 20px 24px;
      border: 0;
      border-bottom: 1px solid rgba(44, 78, 59, 0.06);
      background: transparent;
      color: inherit;
      text-align: left;
      appearance: none;
    }

    .section-toggle {
      cursor: pointer;
      transition: background 0.18s ease;
    }

    .section-toggle:hover {
      background: rgba(63, 116, 93, 0.02);
    }

    .section-toggle:focus-visible {
      outline: 2px solid rgba(47, 107, 78, 0.24);
      outline-offset: -2px;
    }

    #searchSection {
      border-color: rgba(181, 200, 187, 0.4);
      background: linear-gradient(180deg, rgba(246, 248, 242, 0.988), rgba(237, 243, 232, 0.95));
    }

    .trace-gateway {
      margin: 2px 0 8px;
      background:
        radial-gradient(circle at 10% 20%, rgba(110, 162, 136, 0.11), transparent 28%),
        linear-gradient(180deg, rgba(246, 250, 247, 0.988), rgba(234, 243, 238, 0.962));
      border-color: rgba(186, 207, 194, 0.42);
      box-shadow:
        0 16px 38px rgba(8, 20, 16, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.78);
    }

    .trace-gateway-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      text-decoration: none;
      color: inherit;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .trace-gateway-link:hover {
      background: rgba(63, 116, 93, 0.035);
    }

    .trace-gateway-link:focus-visible {
      outline: 2px solid rgba(47, 107, 78, 0.24);
      outline-offset: -2px;
    }

    .trace-gateway-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .trace-gateway-badge {
      width: 46px;
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 15px;
      border: 1px solid rgba(63, 116, 93, 0.12);
      background: linear-gradient(135deg, rgba(91, 135, 116, 0.12), rgba(255, 255, 255, 0.78));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    .trace-gateway-badge svg {
      width: 23px;
      height: 23px;
      stroke: var(--green-deep);
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .trace-gateway-copy {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .trace-gateway-title {
      margin: 0;
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      font-size: clamp(22px, 2.5vw, 26px);
      line-height: 1.16;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    .trace-gateway-meta {
      color: rgba(34, 64, 50, 0.62);
      font-size: 12px;
      line-height: 1.5;
    }

    .trace-gateway-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-shrink: 0;
      min-height: auto;
      padding: 0;
      border: 0;
      background: none;
      color: rgba(35, 70, 57, 0.74);
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .trace-gateway-action::after {
      content: "→";
      font-size: 13px;
      line-height: 1;
    }

    .download-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 4px 0 20px;
      color: rgba(244, 234, 214, 0.58);
    }

    .download-strip::before,
    .download-strip::after {
      content: "";
      flex: 1 1 120px;
      max-width: 128px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(233, 218, 185, 0.34), transparent);
    }

    .download-strip-link {
      color: rgba(244, 234, 214, 0.76);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.2em;
      white-space: nowrap;
      transition: color 0.18s ease, text-shadow 0.18s ease;
    }

    .download-strip-link:hover {
      color: #fff3d6;
      text-shadow: 0 0 18px rgba(229, 197, 142, 0.14);
    }

    .section-head-main {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .section-head-side {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .section-title {
      margin: 0;
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      font-size: 27px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .section-caret {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-right: 2px solid rgba(47, 107, 78, 0.72);
      border-bottom: 2px solid rgba(47, 107, 78, 0.72);
      transform: rotate(45deg) translateY(-2px);
      transition: transform 0.18s ease;
    }

    .section-toggle[aria-expanded="false"] .section-caret {
      transform: rotate(-45deg) translateY(2px);
    }

    .count-chip {
      flex-shrink: 0;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(47, 107, 78, 0.04);
      color: rgba(35, 70, 57, 0.7);
      border: 1px solid rgba(47, 107, 78, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      font-size: 11.5px;
      font-weight: 620;
    }

    .section-body {
      padding: 20px 22px 26px;
    }

    .section-body[hidden] {
      display: none;
    }

    .control-grid {
      display: grid;
      grid-template-columns: minmax(240px, 1.15fr) 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border-radius: 18px;
      border: 1px solid rgba(44, 78, 59, 0.12);
      background: rgba(255, 255, 255, 0.58);
      min-height: 52px;
    }

    .search-box span {
      color: var(--green);
      font-size: 16px;
    }

    .search-input {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      outline: none;
    }

    .search-input::placeholder {
      color: #89968b;
    }

    .filter-group,
    .meta-row,
    .market-meta,
    .hotspot-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-group {
      align-items: center;
      justify-content: flex-end;
    }

    .filter-chip,
    .metric-chip {
      color: var(--ink-soft);
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      user-select: none;
    }

    .filter-chip:hover,
    .metric-chip:hover {
      transform: translateY(-1px);
      border-color: rgba(47, 107, 78, 0.28);
    }

    .filter-chip.active,
    .metric-chip.active {
      color: var(--green-deep);
      border-color: rgba(47, 107, 78, 0.28);
      background: rgba(47, 107, 78, 0.09);
    }

    .meta-row {
      margin-bottom: 16px;
    }

    .entry-list {
      display: grid;
      gap: 10px;
    }

    .entry-card {
      position: relative;
      padding: 17px 17px 15px;
      border-radius: 22px;
      border: 1px solid rgba(44, 78, 59, 0.075);
      background:
        radial-gradient(circle at 100% 0, rgba(227, 200, 148, 0.12), transparent 22%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.56), rgba(255, 255, 255, 0.2)),
        var(--paper-strong);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        0 10px 26px rgba(16, 34, 27, 0.06);
      animation: rise 0.4s ease;
    }

    .entry-card::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 18px;
      width: 52px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(79, 132, 105, 0.65), rgba(79, 132, 105, 0));
      opacity: 0.72;
      pointer-events: none;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .entry-top,
    .entry-title-row,
    .entry-footer,
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 11px;
      flex-wrap: wrap;
    }

    .entry-date {
      color: rgba(101, 120, 109, 0.9);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .entry-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 680;
      color: rgba(39, 72, 59, 0.82);
      background: rgba(47, 107, 78, 0.075);
      border: 1px solid rgba(47, 107, 78, 0.06);
    }

    .tag.up {
      color: #8d4d2e;
      background: rgba(184, 133, 56, 0.12);
      border-color: rgba(184, 133, 56, 0.08);
    }

    .tag.down {
      color: var(--rose);
      background: rgba(168, 88, 68, 0.1);
      border-color: rgba(168, 88, 68, 0.08);
    }

    .entry-price {
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .entry-title {
      margin: 0;
      font-size: 23px;
      line-height: 1.17;
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      letter-spacing: -0.025em;
    }

    .entry-title-button {
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: inherit;
      line-height: inherit;
      font-family: inherit;
      font-weight: inherit;
      text-align: left;
      cursor: pointer;
    }

    .entry-title-button:hover {
      color: var(--green-deep);
    }

    .entry-title-row {
      align-items: flex-end;
      margin-top: 2px;
    }

    .entry-spec {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 999px;
      color: rgba(39, 72, 59, 0.78);
      font-size: 11px;
      font-weight: 650;
      background: rgba(79, 132, 105, 0.07);
      border: 1px solid rgba(79, 132, 105, 0.08);
    }

    .entry-meta {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 9px;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.55;
      flex-wrap: wrap;
    }

    .entry-meta-label,
    .entry-footer-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      color: rgba(39, 72, 59, 0.64);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
      background: rgba(79, 132, 105, 0.06);
      border: 1px solid rgba(79, 132, 105, 0.06);
    }

    .entry-meta-value {
      color: rgba(34, 50, 40, 0.9);
      font-weight: 600;
    }

    .entry-summary {
      margin: 13px 0 0;
      font-size: 13.5px;
      line-height: 1.84;
      color: rgba(33, 49, 39, 0.9);
      max-width: 72ch;
    }

    .entry-price-breakdown {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 8px;
      margin-top: 13px;
    }

    .price-point {
      display: grid;
      gap: 5px;
      align-content: start;
      min-height: 68px;
      padding: 10px 12px;
      border-radius: 15px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.54), rgba(241, 236, 224, 0.84));
      border: 1px solid rgba(44, 78, 59, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.74);
    }

    .price-point-label {
      color: rgba(97, 116, 104, 0.88);
      font-size: 11.5px;
      line-height: 1.4;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .price-point-value {
      color: var(--gold);
      font-size: 15.5px;
      line-height: 1.26;
      font-weight: 700;
      white-space: normal;
    }

    .entry-footer {
      margin-top: 13px;
      padding-top: 11px;
      border-top: 1px solid rgba(44, 78, 59, 0.07);
      color: var(--ink-soft);
      font-size: 12px;
    }

    .entry-source {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .entry-source-name {
      color: rgba(33, 49, 39, 0.82);
    }

    .entry-link {
      color: var(--green);
      text-decoration: none;
      font-weight: 700;
    }

    .entry-link-button {
      padding: 0;
      border: 0;
      background: transparent;

  <script>
    const SEARCH_RENDER_LIMIT = 120;

    const state = {
      dashboard: null,
      originPage: 1,
      originPageSize: 10,
      marketPage: 1,
      marketPageSize: 10,
      hotspotPage: 1,
      hotspotPageSize: 10,
      searchQuery: "",
      searchMode: "current",
      searchHistory: {
        origin: [],
        market: [],
        hotspot: [],
      },
      searchHistoryLoaded: false,
      searchHistoryLoading: false,
      searchHistoryError: "",
      currentMarket: "",
      hotspotKind: "all",
      collapsedSections: {
        origin: true,
        market: true,
        hotspot: true,
        search: true,
      },
    };

    const sectionElements = {
      origin: { toggleId: "originSection", bodyId: "originBody" },
      market: { toggleId: "marketSection", bodyId: "marketBody" },
      hotspot: { toggleId: "hotspotSection", bodyId: "hotspotBody" },
      search: { toggleId: "searchSection", bodyId: "searchBody" },
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function safeUrl(url) {
      if (!String(url || "").trim()) return "";
      try {
        const parsed = new URL(url, window.location.href);
        if (parsed.hostname === "www.yt1998.com" && parsed.pathname === "/ytw/second/marketMgr/detail.jsp") {
          return "";
        }
        if (parsed.protocol === "http:" || parsed.protocol === "https:") {
          return parsed.href;
        }
      } catch (error) {
        return "";
      }
      return "";
    }

    function setSectionCollapsed(sectionKey, collapsed) {
      const body = document.getElementById(sectionElements[sectionKey]?.bodyId || "");
      const toggle = document.querySelector(`[data-section-toggle="${sectionKey}"]`);
      if (!body || !toggle) return;
      state.collapsedSections[sectionKey] = collapsed;
      body.hidden = collapsed;
      toggle.setAttribute("aria-expanded", String(!collapsed));
    }

    function toggleSection(sectionKey) {
      setSectionCollapsed(sectionKey, !state.collapsedSections[sectionKey]);
    }

    function initSectionToggles() {
      document.querySelectorAll("[data-section-toggle]").forEach((button) => {
        button.addEventListener("click", () => {
          toggleSection(button.dataset.sectionToggle);
        });
      });

      Object.keys(sectionElements).forEach((sectionKey) => {
        setSectionCollapsed(sectionKey, state.collapsedSections[sectionKey]);
      });
    }

    function tagClass(tag) {
      if (tag === "上涨") return "tag up";
      if (tag === "回落") return "tag down";
      return "tag";
    }

    function deltaClass(value) {
      const number = Number(value);
      if (Number.isNaN(number) || !value) return "delta";
      if (number > 0) return "delta up";
      if (number < 0) return "delta down";
      return "delta";
    }

    function formatDelta(item) {
      if (!item.delta_amount && !item.delta_rate) return "";
      const amount = item.delta_amount ? `${Number(item.delta_amount) > 0 ? "+" : ""}${escapeHtml(item.delta_amount)}` : "--";
      const rate = item.delta_rate ? `${Number(item.delta_rate) > 0 ? "+" : ""}${(Number(item.delta_rate) * 100).toFixed(1)}%` : "--";
      return `<span class="${deltaClass(item.delta_amount)}">涨跌 ${amount} / ${rate}</span>`;
    }

    function renderPriceBreakdown(item) {
      const points = Array.isArray(item.price_points)
        ? item.price_points.filter((point) => point && point.label && point.price)
        : [];

      if (!points.length && !item.price) return "";

      const rows = points.length
        ? points
        : [{ label: "主流报价", price: item.price }];

      return `
        <div class="entry-price-breakdown">
          ${rows.map((point) => `
            <div class="price-point">
              <span class="price-point-label">${escapeHtml(point.label)}</span>
              <span class="price-point-value">${escapeHtml(point.price)}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderSourceLinks(item, type) {
      if (type === "hotspot") {
        return "";
      }
      const sourceLinks = Array.isArray(item.source_links)
        ? item.source_links.filter((entry) => entry && safeUrl(entry.url))
        : [];
      if (!sourceLinks.length) {
        const url = safeUrl(item.url);
        if (!url) return "";
        return `<a class="entry-link" href="${escapeHtml(url)}" target="_blank" rel="noreferrer">查看来源</a>`;
      }
      const useGenericLabel = type === "origin";
      return `
        <span class="entry-link-list">
          ${sourceLinks.map((entry, index) => `
            <a class="entry-link" href="${escapeHtml(safeUrl(entry.url))}" target="_blank" rel="noreferrer">${escapeHtml(useGenericLabel ? (sourceLinks.length > 1 ? `查看来源 ${index + 1}` : "查看来源") : (entry.label || "查看来源"))}</a>
          `).join("")}
        </span>
      `;
    }

    function renderHotspotCard(item, options = {}) {
      const sectionBadge = options.sectionLabel ? `<span class="tag section-tag">${escapeHtml(options.sectionLabel)}</span>` : "";
      const title = escapeHtml(item.title || "待补标题");
      const modalId = escapeHtml(item.id || "");

      return `
        <article class="entry-card hotspot-card">
          <div class="entry-top">
            <span class="entry-date">${escapeHtml(item.date || "--")}</span>
            <div class="entry-badges">
              ${sectionBadge}
            </div>
          </div>
          <div class="entry-title-row">
            <button class="entry-title entry-title-button" type="button" data-hotspot-open="${modalId}">${title}</button>
          </div>
        </article>
      `;
    }

    function renderEntryCard(item, type, options = {}) {
      if (type === "hotspot") {
        return renderHotspotCard(item, options);
      }
      const title = type === "hotspot" ? item.title : item.herb;
      const specText = type === "origin" ? (item.spec || "") : "";
      const spec = specText ? `<span class="entry-spec">${escapeHtml(specText)}</span>` : "";
      const locationLabel = type === "origin" ? "产区" : "市场";
      const location = type === "origin" ? item.location : item.market;
      const tag = typeof item.tag === "string" ? item.tag.trim() : "";
      const tagBadge = type === "market" && tag
        ? `<span class="${tagClass(tag)}">${escapeHtml(tag)}</span>`
        : "";
      const sectionBadge = options.sectionLabel ? `<span class="tag section-tag">${escapeHtml(options.sectionLabel)}</span>` : "";
      const summaryText = item.content_full || item.summary || "";
      const summary = summaryText ? `<p class="entry-summary">${escapeHtml(summaryText)}</p>` : "";
      const price = "";
      const priceBreakdown = "";
      const delta = type === "origin" && (item.delta_amount || item.delta_rate) ? formatDelta(item) : "";
      return `
        <article class="entry-card">
          <div class="entry-top">
            <span class="entry-date">${escapeHtml(item.date || "--")}</span>
            <div class="entry-badges">
              ${sectionBadge}
              ${tagBadge}
              ${price}
              ${delta}
            </div>
          </div>
          <div class="entry-title-row">
            <h3 class="entry-title">${escapeHtml(title || "待补标题")}</h3>
            ${spec}
          </div>
          <div class="entry-meta">
            <span class="entry-meta-label">${escapeHtml(locationLabel)}</span>
            <span class="entry-meta-value">${escapeHtml(location)}</span>
          </div>
          ${priceBreakdown}
          ${summary}
        </article>
      `;
    }

    function renderHero(dashboard) {
      const updatedAt = dashboard?.meta?.generated_at || dashboard?.meta?.latest_date || "";
      document.getElementById("statusPill").textContent = updatedAt ? `数据更新于 ${updatedAt}` : "数据待补充";
    }

    function renderChipGroup(rootId, items, activeValue, onClick) {
      const root = document.getElementById(rootId);
      root.innerHTML = items.map((item) => `
        <button class="filter-chip ${item.value === activeValue ? "active" : ""}" data-value="${escapeHtml(item.value)}" type="button">
          ${escapeHtml(item.label)}
        </button>
      `).join("");
      root.querySelectorAll(".filter-chip").forEach((button) => {
        button.addEventListener("click", () => onClick(button.dataset.value));
      });
    }

    function matchesSearchQuery(query, parts) {
      const keyword = String(query || "").trim().toLowerCase();
      if (!keyword) return false;
      return parts.join(" ").toLowerCase().includes(keyword);
    }

    function itemSearchText(item) {
      if (item?.search_text) return String(item.search_text);
      const parts = [
        item?.title,
        item?.herb,
        item?.spec,
        item?.location,
        item?.market,
        item?.kind,
        item?.summary,
        item?.content_full,
        item?.source,
        item?.tag,
        item?.price,
      ];
      (item?.price_points || []).forEach((point) => {
        parts.push(point?.label, point?.price);
      });
      (item?.source_links || []).forEach((entry) => {
        parts.push(entry?.label);
      });
      return parts.filter(Boolean).join(" ");
    }

    function hotspotById(id) {
      const currentMatch = (state.dashboard?.hotspots?.items || []).find((item) => item.id === id);
      if (currentMatch) return currentMatch;
      return (state.searchHistory?.hotspot || []).find((item) => item.id === id);
    }

    function normalizeHotspotText(text) {
      return String(text || "")
        .replace(/\u00a0/g, " ")
        .replace(/\r\n?/g, "\n")
        .replace(/[ \t]+\n/g, "\n")
        .replace(/\n{3,}/g, "\n\n")
        .replace(/[ \t]{2,}/g, " ")
        .trim();
    }

    function formatHotspotInline(text) {
      return escapeHtml(String(text || ""))
        .replace(/\*\*/g, "")
        .replace(/“([^”]{2,28})”/g, '<span class="hotspot-inline-note">“$1”</span>');
    }

    function buildHotspotBodyText(item) {
      const content = normalizeHotspotText(item.content_full || item.summary || "暂无正文");
      return content || "暂无正文";
    }

    function useCompactHotspotReadingMode() {
      return window.matchMedia("(max-width: 720px)").matches;
    }

    function normalizeHotspotParagraphs(text) {
      return normalizeHotspotText(text)
        .replace(/([。！？])\s*(0?\d{1,2}\s+)/g, "$1\n\n$2")
        .replace(/([。！？])\s*([一二三四五六七八九十]{1,3}、)/g, "$1\n\n$2")
        .replace(/([：:])\s*([一二三四五六七八九十]{1,3}、)/g, "$1\n\n$2")
        .replace(/([。！？])\s*(（[一二三四五六七八九十]{1,3}）)/g, "$1\n\n$2")
        .replace(/([：:])\s*(（[一二三四五六七八九十]{1,3}）)/g, "$1\n\n$2")
        .replace(/([一二三四五六七八九十]{1,3}、[^\n]{0,40})\s*(（[一二三四五六七八九十]{1,3}）)/g, "$1\n\n$2")
        .replace(/([。！？])\s*(附件[:：]?\s*\d*)/g, "$1\n\n$2")
        .replace(/(附件[:：]?\s*\d*[^\n]{0,56})\s*(附件\d+)/g, "$1\n\n$2")
        .replace(/(\d{4}年\d{1,2}月\d{1,2}日)\s*(附件\d+)/g, "$1\n\n$2")
        .replace(/(（征求意见稿）)\s*(为深入贯彻落实)/g, "$1\n\n$2")
        .replace(/([。！？])\s*(公开征求意见时间\d{4}年\d{1,2}月\d{1,2}日)/g, "$1\n\n$2")
        .replace(/公开征求意见时间/g, "征求意见时间")
        .replace(/(征求意见时间\d{4}年\d{1,2}月\d{1,2}日[^\n]{0,80})\s*(有关单位和个人)/g, "$1\n\n$2")
        .replace(/([。！？])\s*(声明[:：])/g, "$1\n\n$2")
        .replace(/\s*\*\*\s*/g, "\n\n** ")
        .replace(/\s*([①②③④⑤⑥⑦⑧⑨⑩])\s*/g, "\n$1 ");
    }

    function splitHotspotSentence(sentence, maxLength) {
      const trimmed = sentence.trim();
      if (!trimmed || trimmed.length <= maxLength) {
        return trimmed ? [trimmed] : [];
      }

      const clauses = trimmed.match(/[^，,；;、]+[，,；;、]?/g)?.map((clause) => clause.trim()).filter(Boolean);
      if (!clauses || clauses.length <= 1) {
        return [trimmed];
      }

      const groups = [];
      let current = "";

      clauses.forEach((clause) => {
        const candidate = current ? `${current}${clause}` : clause;
        if (current && candidate.length > maxLength) {
          groups.push(current.trim());
          current = clause;
        } else {
          current = candidate;
        }
      });

      if (current) groups.push(current.trim());
      return groups;
    }

    function expandStructuredHotspotBlock(block) {
      const trimmed = block.trim();
      if (!trimmed) return [];

      const headingWithSentence = trimmed.match(/^([一二三四五六七八九十]{1,3}、[^。！？\n]{2,28})[。:：]\s*(.+)$/);
      if (headingWithSentence) {
        return [headingWithSentence[1].trim(), headingWithSentence[2].trim()];
      }

      const headingWithGap = trimmed.match(/^([一二三四五六七八九十]{1,3}、[^\s。！？\n]{2,18})\s+(.+)$/);
      if (headingWithGap) {
        return [headingWithGap[1].trim(), headingWithGap[2].trim()];
      }

      const subheadingWithSentence = trimmed.match(/^(（[一二三四五六七八九十]{1,3}）[^。！？\n]{2,32})[。:：]\s*(.+)$/);
      if (subheadingWithSentence) {
        return [subheadingWithSentence[1].trim(), subheadingWithSentence[2].trim()];
      }

      return [trimmed];
    }

    function splitHotspotLongBlock(block) {
      const trimmed = block.trim();
      if (!trimmed) return [];

      const isStructuredBlock = (
        /^0?\d{1,2}\s+/.test(trimmed) ||
        /^[一二三四五六七八九十]{1,3}、/.test(trimmed) ||
        /^（[一二三四五六七八九十]{1,3}）/.test(trimmed) ||
        /^附件[:：]?\s*\d*/.test(trimmed) ||
        /^\*\*\s*/.test(trimmed)
      );

      const maxLength = useCompactHotspotReadingMode() ? 84 : 150;
      if (isStructuredBlock || trimmed.length <= maxLength) {
        return [trimmed];
      }

      const sentences = trimmed.match(/[^。！？；;]+[。！？；;]?/g)?.map((sentence) => sentence.trim()).filter(Boolean) || [trimmed];
      const splitSentences = sentences.flatMap((sentence) => splitHotspotSentence(sentence, maxLength));
      const groups = [];
      let current = "";

      splitSentences.forEach((sentence) => {
        const candidate = current ? `${current}${sentence}` : sentence;
        if (current && candidate.length > maxLength) {
          groups.push(current.trim());
          current = sentence;
        } else {
          current = candidate;
        }
      });

      if (current) groups.push(current.trim());
      return groups;
    }

    function formatHotspotContent(text) {
      const blocks = normalizeHotspotParagraphs(text)
        .split(/\n{2,}/)
        .map((block) => block.trim())
        .filter(Boolean)
        .flatMap((block) => expandStructuredHotspotBlock(block))
        .flatMap((block) => splitHotspotLongBlock(block));

      return blocks.map((block) => {
        if (/^0?\d{1,2}\s+/.test(block)) {
          return `<h4 class="hotspot-section-title">${formatHotspotInline(block)}</h4>`;
        }
        if (/^[一二三四五六七八九十]{1,3}、/.test(block) || /^（[一二三四五六七八九十]{1,3}）/.test(block) || /^附件[:：]?\s*\d*/.test(block)) {
          return `<h4 class="hotspot-section-title hotspot-subsection-title">${formatHotspotInline(block)}</h4>`;
        }
        if (/^\*\*\s*/.test(block)) {
          const cleaned = block.replace(/^\*\*\s*/, "");
          return `<p class="hotspot-focus-line">${formatHotspotInline(cleaned)}</p>`;
        }
        return `<p>${formatHotspotInline(block)}</p>`;
      }).join("");
    }

    function renderHotspotActions(item) {
      const note = `<div class="hotspot-modal-action-note">正文按阅读版式整理，原文来源保留在公开链接中。</div>`;
      if (!item.url) return note;
      return `
        ${note}
        <a class="button hotspot-source-button" href="${safeUrl(item.url)}" target="_blank" rel="noreferrer">查看原文</a>
      `;
    }

    function openHotspotModal(id) {
      const item = hotspotById(id);
      if (!item) return;
      const modal = document.getElementById("hotspotModal");
      const bodyText = buildHotspotBodyText(item);
      document.getElementById("hotspotModalTitle").textContent = item.title || "行业热点";
      document.getElementById("hotspotModalMeta").textContent = [item.date, item.source].filter(Boolean).join(" · ");
      document.getElementById("hotspotModalBody").innerHTML = formatHotspotContent(bodyText);
      document.getElementById("hotspotModalActions").innerHTML = renderHotspotActions(item);
      modal.hidden = false;
      document.body.style.overflow = "hidden";
    }

    function closeHotspotModal() {
      const modal = document.getElementById("hotspotModal");
      modal.hidden = true;
      document.body.style.overflow = "";
    }

    function filteredOriginItems() {
      if (!state.dashboard) return [];
      return state.dashboard.origin.items || [];
    }

    function latestDate(items) {
      return items
        .map((item) => item.date)
        .filter(Boolean)
        .sort()
        .reverse()[0] || "--";
    }

    function latestCount(section, items) {
      const explicit = section?.latest_count;
      if (explicit !== undefined && explicit !== null && explicit !== "") {
        return Number(explicit) || 0;
      }
      const latest = section?.latest_date || latestDate(items);
      if (!latest || latest === "--") return 0;
      return (items || []).filter((item) => item.date === latest).length;
    }

    function uniqueSources(items) {
      return [...new Set((items || []).map((item) => item.source).filter(Boolean))];
    }

    function renderSearchModeSwitch() {
      renderChipGroup(
        "searchModeSwitch",
        [
          { value: "current", label: "搜索最近数据" },
          { value: "history", label: "搜索历史数据" },
        ],
        state.searchMode,
        (value) => {
          void setSearchMode(value);
        }
      );
    }

    async function ensureSearchHistory() {
      if (state.searchHistoryLoaded || state.searchHistoryLoading) return;
      state.searchHistoryLoading = true;
      state.searchHistoryError = "";
      renderSearchSection(state.dashboard);
      try {
        const [originResponse, marketResponse, hotspotResponse] = await Promise.all([
          fetch("./data/origin-search-index.json"),
          fetch("./data/market-search-index.json"),
          fetch("./data/hotspot-search-index.json"),
        ]);
        if (!originResponse.ok || !marketResponse.ok || !hotspotResponse.ok) {
          throw new Error("Failed to load history search indexes.");
        }
        const [originPayload, marketPayload, hotspotPayload] = await Promise.all([
          originResponse.json(),
          marketResponse.json(),
          hotspotResponse.json(),
        ]);
        state.searchHistory = {
          origin: originPayload?.items || [],
          market: marketPayload?.items || [],
          hotspot: hotspotPayload?.items || [],
        };
        state.searchHistoryLoaded = true;
      } catch (error) {
        console.error(error);
        state.searchHistoryError = "历史检索索引加载失败，请稍后重试。";
      } finally {
        state.searchHistoryLoading = false;
        renderSearchSection(state.dashboard);
      }
    }

    async function setSearchMode(mode) {
      if (!mode || state.searchMode === mode) return;
      state.searchMode = mode;
      renderSearchSection(state.dashboard);
      if (mode === "history") {
        await ensureSearchHistory();
      }
    }

    function currentSearchCollections() {
      return {
        origin: state.dashboard?.origin?.items || [],
        market: (state.dashboard?.markets?.groups || []).flatMap((group) => group.items || []),
        hotspot: state.dashboard?.hotspots?.items || [],
      };
    }

    function historySearchCollections() {
      return {
        origin: state.searchHistory?.origin || [],
        market: state.searchHistory?.market || [],
        hotspot: state.searchHistory?.hotspot || [],
      };
    }

    function collectSearchResults() {
      if (!state.dashboard) return [];
      const query = state.searchQuery;
      if (!query.trim()) return [];
      if (state.searchMode === "history" && !state.searchHistoryLoaded) return [];

      const results = [];
      const collections = state.searchMode === "history" ? historySearchCollections() : currentSearchCollections();
      const pushMatches = (items, type, sectionLabel) => {
        (items || []).forEach((item) => {
          const matched = matchesSearchQuery(query, [itemSearchText(item)]);
          if (query.trim() && !matched) return;
          results.push({
            ...item,
            _searchType: type,
            _searchSection: sectionLabel,
          });
        });
      };

      pushMatches(collections.origin, "origin", "产地行情");
      pushMatches(collections.market, "market", "市场行情");
      pushMatches(collections.hotspot, "hotspot", "行业热点");

      return results.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
    }

    async function applySearch() {
      const input = document.getElementById("globalSearch");
      state.searchQuery = input ? input.value : "";
      if (state.searchMode === "history") {
        await ensureSearchHistory();
      }
      renderSearchSection(state.dashboard);
    }

    function renderOriginSection(dashboard) {
      const allItems = filteredOriginItems();
      const totalPages = Math.max(1, Math.ceil(allItems.length / state.originPageSize));
      if (state.originPage > totalPages) state.originPage = totalPages;
      const start = (state.originPage - 1) * state.originPageSize;
      const pageItems = allItems.slice(start, start + state.originPageSize);

      document.getElementById("originCountChip").textContent = `今日更新 ${latestCount(dashboard.origin, allItems)} 条`;

      const root = document.getElementById("originList");
      root.innerHTML = pageItems.length
        ? pageItems.map((item) => renderEntryCard(item, "origin")).join("")
        : `<div class="empty-state">${escapeHtml(dashboard.origin.empty_text)}</div>`;

      document.getElementById("originPageInfo").textContent = `第 ${state.originPage} 页 / 共 ${totalPages} 页`;
      document.getElementById("originPrev").disabled = state.originPage === 1;
      document.getElementById("originNext").disabled = state.originPage === totalPages;
    }

    function renderMarketSection(dashboard) {
      const groups = dashboard.markets.groups || [];
      const targetMarkets = dashboard.markets.targets || ["亳州", "安国", "玉林", "成都"];
      const tabs = targetMarkets.map((name) => {
        const group = groups.find((item) => item.name === name);
        return {
          name,
          items: group?.items || [],
        };
      });
      const totalMatches = tabs.reduce((sum, group) => sum + group.items.length, 0);

      if (!tabs.find((group) => group.name === state.currentMarket)) {
        state.currentMarket = tabs.find((group) => group.items.length)?.name || tabs[0]?.name || "";
      }

      const currentGroup = tabs.find((group) => group.name === state.currentMarket) || tabs[0];

      document.getElementById("marketCountChip").textContent = `今日更新 ${latestCount(dashboard.markets, groups.flatMap((group) => group.items || []))} 条`;
      document.getElementById("marketTabs").innerHTML = tabs.map((group) => `
        <button class="market-tab ${group.name === state.currentMarket ? "active" : ""}" type="button" data-market="${escapeHtml(group.name)}">
          ${escapeHtml(group.name)}市场
        </button>
      `).join("");

      document.querySelectorAll(".market-tab").forEach((button) => {
        button.addEventListener("click", () => {
          state.currentMarket = button.dataset.market;
          state.marketPage = 1;
          renderMarketSection(state.dashboard);
        });
      });

      const list = document.getElementById("marketList");
      const currentItems = currentGroup?.items || [];

      if (!currentGroup || !currentItems.length) {
        list.innerHTML = `<div class="empty-state">${escapeHtml(String(dashboard.markets.empty_text || "").replace(/天天行情/g, "市场行情"))}</div>`;
        document.getElementById("marketPageInfo").textContent = "第 1 页 / 共 1 页";
        document.getElementById("marketPrev").disabled = true;
        document.getElementById("marketNext").disabled = true;
        return;
      }

      const totalPages = Math.max(1, Math.ceil(currentItems.length / state.marketPageSize));
      if (state.marketPage > totalPages) state.marketPage = totalPages;
      const start = (state.marketPage - 1) * state.marketPageSize;
      const pageItems = currentItems.slice(start, start + state.marketPageSize);

      list.innerHTML = pageItems.map((item) => renderEntryCard(item, "market")).join("");
      document.getElementById("marketPageInfo").textContent = `第 ${state.marketPage} 页 / 共 ${totalPages} 页`;
      document.getElementById("marketPrev").disabled = state.marketPage === 1;
      document.getElementById("marketNext").disabled = state.marketPage === totalPages;
    }

    function renderHotspotSection(dashboard) {
      const items = (dashboard.hotspots.items || []).filter((item) => state.hotspotKind === "all" || item.kind === state.hotspotKind);
      document.getElementById("hotspotCountChip").textContent = `今日更新 ${latestCount(dashboard.hotspots, items)} 条`;

      const hotspotFilterRoot = document.getElementById("hotspotFilters");
      const kindOptions = dashboard.hotspots.kind_options || [];
      if (kindOptions.length > 1) {
        hotspotFilterRoot.style.display = "";
        renderChipGroup(
          "hotspotFilters",
          [{ value: "all", label: "全部类型" }, ...kindOptions.map((value) => ({ value, label: value }))],
          state.hotspotKind,
          (value) => {
            state.hotspotKind = value;
            state.hotspotPage = 1;
            renderHotspotSection(state.dashboard);
          }
        );
      } else {
        hotspotFilterRoot.style.display = "none";
        hotspotFilterRoot.innerHTML = "";
        state.hotspotKind = "all";
      }

      const totalPages = Math.max(1, Math.ceil(items.length / state.hotspotPageSize));
      if (state.hotspotPage > totalPages) state.hotspotPage = totalPages;
      const start = (state.hotspotPage - 1) * state.hotspotPageSize;
      const pageItems = items.slice(start, start + state.hotspotPageSize);

      document.getElementById("hotspotList").innerHTML = items.length
        ? pageItems.map((item) => renderEntryCard(item, "hotspot")).join("")
        : `<div class="empty-state">${escapeHtml(dashboard.hotspots.empty_text)}</div>`;
      document.getElementById("hotspotPageInfo").textContent = `第 ${state.hotspotPage} 页 / 共 ${totalPages} 页`;
      document.getElementById("hotspotPrev").disabled = state.hotspotPage === 1;
      document.getElementById("hotspotNext").disabled = state.hotspotPage === totalPages || items.length === 0;
    }

    function renderSearchSection(dashboard) {
      const query = state.searchQuery.trim();
      const results = collectSearchResults();
      const root = document.getElementById("searchList");
      const meta = document.getElementById("searchMeta");
      const countChip = document.getElementById("searchCountChip");
      renderSearchModeSwitch();

      if (state.searchMode === "history" && state.searchHistoryLoading) {
        countChip.textContent = "加载中";
        meta.innerHTML = `<span class="metric-chip active">正在加载历史检索索引</span>`;
        root.innerHTML = `<div class="empty-state">正在加载历史检索索引，请稍候。</div>`;
        return;
      }

      if (state.searchMode === "history" && state.searchHistoryError) {
        countChip.textContent = "加载失败";
        meta.innerHTML = "";
        root.innerHTML = `<div class="empty-state">${escapeHtml(state.searchHistoryError)}</div>`;
        return;
      }

      if (!query) {
        countChip.textContent = "未搜索";
        meta.innerHTML = "";
        root.innerHTML = `<div class="empty-state">${
          state.searchMode === "history"
            ? "输入关键词后，可在这里搜索产地行情、市场行情和行业热点的全部历史数据，包含最新内容。"
            : "输入关键词后，可在这里集中查看最近展示的产地行情、市场行情和行业热点内容。"
        }</div>`;
        return;
      }

      const originCount = results.filter((item) => item._searchSection === "产地行情").length;
      const marketCount = results.filter((item) => item._searchSection === "市场行情").length;
      const hotspotCount = results.filter((item) => item._searchSection === "行业热点").length;
      const renderedResults = results.slice(0, SEARCH_RENDER_LIMIT);

      countChip.textContent = `${results.length} 条`;
      meta.innerHTML = [
        `<span class="metric-chip active">关键词：${escapeHtml(query)}</span>`,
        `<span class="metric-chip">产地行情 ${originCount} 条</span>`,
        `<span class="metric-chip">市场行情 ${marketCount} 条</span>`,
        `<span class="metric-chip">行业热点 ${hotspotCount} 条</span>`,
        results.length > SEARCH_RENDER_LIMIT ? `<span class="metric-chip">当前仅显示前 ${SEARCH_RENDER_LIMIT} 条</span>` : "",
      ].filter(Boolean).join("");

      root.innerHTML = results.length
        ? renderedResults.map((item) => renderEntryCard(item, item._searchType, { sectionLabel: item._searchSection })).join("")
        : `<div class="empty-state">没有找到符合当前检索条件的内容。</div>`;
    }

    function renderFailure(message) {
      document.getElementById("statusPill").textContent = "数据加载失败";
      document.getElementById("originList").innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
      document.getElementById("marketList").innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
      document.getElementById("hotspotList").innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
      document.getElementById("searchList").innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
    }

    async function loadSiteVisits() {
      const footerTraffic = document.getElementById("footerTraffic");
      try {
        const response = await fetch("https://bsz.saop.cc/api", {
          method: "POST",
          credentials: "include",
          headers: {
            "x-bsz-referer": `${window.location.origin}/`,
          },
        });
        if (!response.ok) throw new Error(`Failed to load site visits: ${response.status}`);
        const payload = await response.json();
        if (!payload.success || !payload.data) throw new Error("Invalid site visits payload");
        footerTraffic.textContent = `本站总访问量 ${Number(payload.data.site_pv || 0).toLocaleString("zh-CN")} 次`;
      } catch (error) {
        console.error(error);
        footerTraffic.textContent = "本站总访问量 -- 次";
      }
    }

    async function loadDashboard() {
      try {
        const response = await fetch("./data/dashboard.json");
        if (!response.ok) throw new Error(`Failed to load dashboard.json: ${response.status}`);
        state.dashboard = await response.json();
        state.currentMarket = (state.dashboard.markets.groups || []).find((group) => group.count > 0)?.name || "";
        renderHero(state.dashboard);
        renderOriginSection(state.dashboard);
        renderMarketSection(state.dashboard);
        renderHotspotSection(state.dashboard);
        renderSearchSection(state.dashboard);

        document.getElementById("globalSearch").addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            void applySearch();
          }
        });

        document.getElementById("globalSearchSubmit").addEventListener("click", () => {
          void applySearch();
        });

        document.addEventListener("click", (event) => {
          const trigger = event.target.closest("[data-hotspot-open]");
          if (trigger) {
            openHotspotModal(trigger.getAttribute("data-hotspot-open"));
            return;
          }
          const modal = document.getElementById("hotspotModal");
          if (!modal.hidden && event.target === modal) {
            closeHotspotModal();
          }
        });

        document.getElementById("hotspotModalClose").addEventListener("click", () => {
          closeHotspotModal();
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !document.getElementById("hotspotModal").hidden) {
            closeHotspotModal();
          }
        });

        document.getElementById("originPrev").addEventListener("click", () => {
          if (state.originPage > 1) {
            state.originPage -= 1;
            renderOriginSection(state.dashboard);
          }
        });

        document.getElementById("originNext").addEventListener("click", () => {
          const totalPages = Math.max(1, Math.ceil(filteredOriginItems().length / state.originPageSize));
          if (state.originPage < totalPages) {
            state.originPage += 1;
            renderOriginSection(state.dashboard);
          }
        });

        document.getElementById("marketPrev").addEventListener("click", () => {
          if (state.marketPage > 1) {
            state.marketPage -= 1;
            renderMarketSection(state.dashboard);
          }
        });

        document.getElementById("marketNext").addEventListener("click", () => {
          const groups = state.dashboard.markets.groups || [];
          const currentGroup = groups.find((group) => group.name === state.currentMarket) || groups[0] || { items: [] };
          const totalPages = Math.max(1, Math.ceil((currentGroup.items || []).length / state.marketPageSize));
          if (state.marketPage < totalPages) {
            state.marketPage += 1;
            renderMarketSection(state.dashboard);
          }
        });

        document.getElementById("hotspotPrev").addEventListener("click", () => {
          if (state.hotspotPage > 1) {
            state.hotspotPage -= 1;
            renderHotspotSection(state.dashboard);
          }
        });

        document.getElementById("hotspotNext").addEventListener("click", () => {
          const items = (state.dashboard.hotspots.items || []).filter((item) => state.hotspotKind === "all" || item.kind === state.hotspotKind);
          const totalPages = Math.max(1, Math.ceil(items.length / state.hotspotPageSize));
          if (state.hotspotPage < totalPages) {
            state.hotspotPage += 1;
            renderHotspotSection(state.dashboard);
          }
        });
      } catch (error) {
        console.error(error);
        renderFailure("当前没有读到 dashboard.json，请先运行数据生成脚本。");
      }
    }

    async function registerServiceWorker() {
      if (!("serviceWorker" in navigator) || !window.isSecureContext) return;
      try {
        await navigator.serviceWorker.register("/sw.js");
      } catch (error) {
        console.warn("Service worker register failed:", error);
      }
    }

    initSectionToggles();
    loadSiteVisits();
    loadDashboard();
    registerServiceWorker();
  </script>
</body>
</html>
