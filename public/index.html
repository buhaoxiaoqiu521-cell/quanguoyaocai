<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中药材全国追踪</title>
  <style>
    :root {
      --bg: #10251f;
      --bg-deep: #0a1915;
      --paper: rgba(247, 240, 223, 0.95);
      --paper-strong: rgba(250, 244, 231, 0.98);
      --paper-soft: rgba(241, 232, 209, 0.8);
      --ink: #213127;
      --ink-soft: #5c6d61;
      --line: rgba(40, 82, 59, 0.16);
      --line-strong: rgba(40, 82, 59, 0.3);
      --green: #2f6b4e;
      --green-deep: #1d4c37;
      --gold: #b88538;
      --gold-soft: #e5c58e;
      --rose: #a85844;
      --shadow: 0 30px 80px rgba(7, 21, 16, 0.28);
      --radius-lg: 30px;
      --radius-md: 22px;
      --radius-sm: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(229, 197, 142, 0.12), transparent 24%),
        radial-gradient(circle at 85% 12%, rgba(112, 155, 122, 0.18), transparent 22%),
        linear-gradient(180deg, #112820 0%, #0d1d18 46%, #09120f 100%);
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 30px 30px;
      opacity: 0.25;
    }

    .shell {
      width: min(1260px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 56px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 20px 4px 26px;
      color: #f4ead6;
      text-align: center;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 0;
      max-width: 980px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(38px, 5vw, 64px);
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    .brand p {
      margin: 0;
      color: rgba(244, 234, 214, 0.74);
      font-size: clamp(17px, 2.2vw, 22px);
      line-height: 1.75;
      max-width: 880px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1px solid rgba(229, 197, 142, 0.2);
      background: rgba(244, 234, 214, 0.08);
      color: #f8efdb;
      font-size: 13px;
      white-space: nowrap;
    }

    .status-pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #7bb38d;
      box-shadow: 0 0 0 0 rgba(123, 179, 141, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(123, 179, 141, 0.58); }
      70% { box-shadow: 0 0 0 14px rgba(123, 179, 141, 0); }
      100% { box-shadow: 0 0 0 0 rgba(123, 179, 141, 0); }
    }

    .panel {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 247, 232, 0.14);
      box-shadow: var(--shadow);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(229, 197, 142, 0.78), transparent);
      opacity: 0.6;
      pointer-events: none;
    }

    .hero {
      display: block;
      background:
        radial-gradient(circle at 18% 12%, rgba(229, 197, 142, 0.14), transparent 24%),
        linear-gradient(135deg, rgba(18, 42, 33, 0.98), rgba(14, 30, 24, 0.98));
      margin-bottom: 22px;
    }

    .hero-copy {
      padding: 30px 34px;
      color: #f6eddb;
    }

    .hero-card {
      padding: 30px 32px;
      border-radius: 28px;
      border: 1px solid rgba(247, 240, 223, 0.1);
      background: rgba(247, 240, 223, 0.04);
      max-width: 1100px;
      margin: 0 auto;
      text-align: center;
    }

    .hero-title {
      margin: 0 0 12px;
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      font-size: clamp(30px, 4.2vw, 48px);
      line-height: 1.18;
      letter-spacing: -0.04em;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
      justify-content: center;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 144px;
      padding: 13px 18px;
      border-radius: 999px;
      border: 1px solid rgba(247, 240, 223, 0.14);
      color: #f8efdb;
      text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      background: rgba(247, 240, 223, 0.06);
      font-size: 14px;
      font-weight: 600;
    }

    .button:hover {
      transform: translateY(-1px);
      border-color: rgba(229, 197, 142, 0.42);
      background: rgba(247, 240, 223, 0.1);
    }

    .button.primary {
      color: #1b3327;
      background: linear-gradient(135deg, #e7c789, #f6e7c7);
      border-color: transparent;
    }

    .button.trace {
      color: #fff3d6;
      border-color: rgba(229, 197, 142, 0.34);
      background: rgba(184, 133, 56, 0.16);
      min-width: 260px;
      min-height: 72px;
      padding: 18px 30px;
      font-size: 24px;
      font-weight: 700;
    }

    .hero-note-title {
      margin: 14px 0 8px;
      font-size: 18px;
      color: #f6e8c6;
      font-weight: 700;
    }

    .hero-note {
      margin: 0;
      color: rgba(246, 237, 219, 0.78);
      font-size: 14px;
      line-height: 1.8;
    }

    .global-search {
      margin-top: 20px;
    }

    .global-search-body {
      padding: 20px 22px 24px;
    }

    .global-search-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: 820px;
      margin: 0 auto 18px;
    }

    .global-search-box {
      flex: 1 1 620px;
      width: 100%;
      max-width: 620px;
      min-width: 0;
      min-height: 58px;
      background: rgba(255, 255, 255, 0.56);
      border-color: rgba(44, 78, 59, 0.12);
      padding: 0 18px;
    }

    .global-search-box span {
      color: var(--green);
      font-weight: 700;
      white-space: nowrap;
    }

    .global-search .search-input {
      color: var(--ink);
    }

    .global-search .search-input::placeholder {
      color: #89968b;
    }

    .search-submit {
      min-width: 128px;
      min-height: 58px;
      padding: 0 24px;
      border: 1px solid transparent;
      background: linear-gradient(135deg, var(--green), #47795b);
      color: #fff8eb;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .search-submit:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, #356d51, #4f8364);
    }

    .global-search-meta {
      justify-content: center;
      margin-bottom: 16px;
    }

    .global-search-filters {
      display: grid;
      gap: 12px;
      justify-items: center;
      margin-bottom: 16px;
    }

    .tag.section-tag {
      color: #fff8eb;
      background: linear-gradient(135deg, var(--green), #47795b);
    }

    .source-chip,
    .filter-chip,
    .metric-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.02);
    }

    .source-chip {
      color: #eadbbd;
      border-color: rgba(247, 240, 223, 0.12);
      background: rgba(247, 240, 223, 0.05);
    }

    .quick-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
      position: sticky;
      top: 14px;
      z-index: 4;
      justify-content: center;
    }

    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 999px;
      text-decoration: none;
      color: #f7efdf;
      border: 1px solid rgba(247, 240, 223, 0.12);
      background: rgba(9, 19, 15, 0.64);
      backdrop-filter: blur(12px);
      transition: transform 0.18s ease, border-color 0.18s ease;
      font-size: 14px;
    }

    .nav-pill:hover {
      transform: translateY(-1px);
      border-color: rgba(229, 197, 142, 0.36);
    }

    .section {
      margin-bottom: 20px;
      background: var(--paper);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 26px 28px 20px;
      border-bottom: 1px solid rgba(44, 78, 59, 0.08);
    }

    .section-title {
      margin: 0;
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      font-size: 30px;
      line-height: 1.2;
    }

    .count-chip {
      flex-shrink: 0;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(47, 107, 78, 0.08);
      color: var(--green-deep);
      border: 1px solid rgba(47, 107, 78, 0.14);
      font-size: 13px;
      font-weight: 700;
    }

    .section-body {
      padding: 20px 22px 26px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: minmax(240px, 1.15fr) 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border-radius: 18px;
      border: 1px solid rgba(44, 78, 59, 0.12);
      background: rgba(255, 255, 255, 0.58);
      min-height: 52px;
    }

    .search-box span {
      color: var(--green);
      font-size: 16px;
    }

    .search-input {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      outline: none;
    }

    .search-input::placeholder {
      color: #89968b;
    }

    .filter-group,
    .meta-row,
    .market-meta,
    .hotspot-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-group {
      align-items: center;
      justify-content: flex-end;
    }

    .filter-chip,
    .metric-chip {
      color: var(--ink-soft);
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      user-select: none;
    }

    .filter-chip:hover,
    .metric-chip:hover {
      transform: translateY(-1px);
      border-color: rgba(47, 107, 78, 0.28);
    }

    .filter-chip.active,
    .metric-chip.active {
      color: var(--green-deep);
      border-color: rgba(47, 107, 78, 0.28);
      background: rgba(47, 107, 78, 0.09);
    }

    .meta-row {
      margin-bottom: 16px;
    }

    .entry-list {
      display: grid;
      gap: 10px;
    }

    .entry-card {
      padding: 16px;
      border-radius: 20px;
      border: 1px solid rgba(44, 78, 59, 0.08);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.44), rgba(255, 255, 255, 0.18)),
        var(--paper-strong);
      animation: rise 0.4s ease;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .entry-top,
    .entry-title-row,
    .entry-footer,
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .entry-date {
      color: var(--ink-soft);
      font-size: 12px;
    }

    .entry-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: var(--green-deep);
      background: rgba(47, 107, 78, 0.1);
    }

    .tag.up {
      color: #8d4d2e;
      background: rgba(184, 133, 56, 0.14);
    }

    .tag.down {
      color: var(--rose);
      background: rgba(168, 88, 68, 0.12);
    }

    .entry-price {
      color: var(--gold);
      font-size: 14px;
      font-weight: 700;
    }

    .entry-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.22;
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    }

    .entry-spec {
      color: var(--green);
      font-size: 13px;
      font-weight: 600;
    }

    .entry-meta {
      margin-top: 8px;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.65;
    }

    .entry-summary {
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 1.65;
      color: var(--ink);
    }

    .entry-price-breakdown {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .price-point {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(47, 107, 78, 0.05);
      border: 1px solid rgba(44, 78, 59, 0.1);
    }

    .price-point-label {
      color: var(--ink);
      font-size: 13px;
      line-height: 1.5;
      font-weight: 600;
    }

    .price-point-value {
      color: var(--gold);
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      white-space: nowrap;
    }

    .entry-footer {
      margin-top: 10px;
      color: var(--ink-soft);
      font-size: 12px;
    }

    .entry-link {
      color: var(--green);
      text-decoration: none;
      font-weight: 700;
    }

    .entry-link:hover {
      text-decoration: underline;
    }

    .entry-link-list {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .delta {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(47, 107, 78, 0.08);
      color: var(--green-deep);
    }

    .delta.up {
      background: rgba(184, 133, 56, 0.14);
      color: #8d4d2e;
    }

    .delta.down {
      background: rgba(168, 88, 68, 0.12);
      color: var(--rose);
    }

    .pager {
      margin-top: 16px;
    }

    .pager-info {
      color: var(--ink-soft);
      font-size: 14px;
    }

    .pager-button {
      min-width: 112px;
      padding: 11px 15px;
      border-radius: 14px;
      border: 1px solid rgba(44, 78, 59, 0.14);
      background: rgba(255, 255, 255, 0.5);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease, border-color 0.18s ease;
    }

    .pager-button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(47, 107, 78, 0.28);
    }

    .pager-button:disabled {
      opacity: 0.36;
      cursor: not-allowed;
    }

    .market-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      justify-content: center;
    }

    .market-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1px solid rgba(44, 78, 59, 0.14);
      background: rgba(255, 255, 255, 0.52);
      color: var(--ink-soft);
      cursor: pointer;
      font: inherit;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .market-tab:hover {
      transform: translateY(-1px);
      border-color: rgba(47, 107, 78, 0.28);
    }

    .market-tab.active {
      color: #fff8eb;
      background: linear-gradient(135deg, var(--green), #47795b);
      border-color: transparent;
    }

    .market-summary {
      margin-bottom: 16px;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.85;
      text-align: center;
    }

    .empty-state {
      padding: 22px;
      border-radius: 22px;
      border: 1px dashed rgba(44, 78, 59, 0.18);
      color: var(--ink-soft);
      background: rgba(255, 255, 255, 0.38);
      font-size: 15px;
      line-height: 1.9;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 8px 6px 0;
      color: rgba(244, 234, 214, 0.8);
      font-size: 13px;
    }

    .footer-traffic {
      width: 100%;
      text-align: center;
      color: rgba(244, 234, 214, 0.88);
      font-size: 15px;
      letter-spacing: 0.02em;
    }

    .muted {
      color: var(--ink-soft);
    }

    @media (max-width: 1024px) {
      .control-grid {
        grid-template-columns: 1fr;
      }

      .filter-group {
        justify-content: flex-start;
      }
    }

    @media (max-width: 720px) {
      .shell {
        width: min(100%, calc(100% - 18px));
        padding-top: 18px;
      }

      .topbar {
        align-items: center;
        flex-direction: column;
        padding-bottom: 18px;
        text-align: center;
      }

      .hero-copy,
      .hero-copy {
        padding: 24px 18px 20px;
      }

      .global-search-body {
        padding: 16px 14px;
      }

      .global-search-controls {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        margin-bottom: 14px;
        max-width: 100%;
      }

      .global-search-box {
        flex: 0 0 auto;
        max-width: none;
      }

      .global-search-filters {
        gap: 8px;
      }

      .global-search-filters .filter-group {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
        gap: 6px;
        justify-content: stretch;
      }

      .global-search-filters .filter-chip {
        width: 100%;
        min-height: 36px;
        justify-content: center;
        padding: 7px 8px;
        font-size: 11px;
        line-height: 1.2;
        border-radius: 14px;
      }

      .search-submit {
        width: 132px;
        min-width: 132px;
        min-height: 48px;
        align-self: center;
        padding: 0 20px;
        font-size: 15px;
      }

      .hero-title {
        font-size: clamp(28px, 9vw, 42px);
      }

      .hero-card {
        padding: 20px 16px;
      }

      .button.trace {
        width: 100%;
        min-width: 0;
        min-height: 58px;
        font-size: 19px;
      }

      .section-head {
        padding: 18px 16px 14px;
      }

      .section-body {
        padding: 14px 12px 18px;
      }

      .section-title {
        font-size: 24px;
      }

      .entry-title {
        font-size: 18px;
      }

      .entry-card {
        padding: 13px 12px;
        border-radius: 18px;
      }

      .entry-list {
        gap: 8px;
      }

      .entry-top,
      .entry-title-row,
      .entry-footer {
        gap: 8px;
      }

      .entry-date,
      .entry-spec,
      .entry-meta,
      .entry-footer {
        font-size: 12px;
      }

      .entry-summary {
        margin-top: 8px;
        font-size: 13px;
        line-height: 1.55;
      }

      .entry-price-breakdown {
        gap: 6px;
        margin-top: 10px;
      }

      .price-point {
        padding: 8px 10px;
        border-radius: 12px;
        gap: 10px;
      }

      .price-point-label,
      .price-point-value {
        font-size: 12px;
      }

      .entry-meta {
        margin-top: 6px;
        line-height: 1.5;
      }

      .tag,
      .delta {
        padding: 4px 8px;
        font-size: 11px;
      }

      .entry-price {
        font-size: 13px;
      }

      .quick-nav {
        top: 8px;
        gap: 8px;
        margin-bottom: 18px;
      }

      .nav-pill {
        width: calc(50% - 4px);
        justify-content: center;
        padding: 10px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <h1>中药材全国追踪</h1>
        <p>聚合产地行情、市场动态与行业快讯的一站式中药材信息情报中心。</p>
      </div>
      <div class="status-pill" id="statusPill">正在读取数据</div>
    </header>

    <section class="hero panel">
      <div class="hero-copy">
        <article class="hero-card">
          <h2 class="hero-title">曹操溯源平台</h2>
          <div class="hero-actions">

          <button class="pager-button" id="hotspotPrev">上一页</button>

      <div class="section-head">

            <span>检索</span>

          </label>

        </div>

          <div class="filter-group" id="searchDateFilters"></div>

      <div class="footer-traffic" id="footerTraffic">本站总访问量 -- 次</div>

  </main>

  <script>
    const state = {
      dashboard: null,
      originPage: 1,
      originPageSize: 10,
      marketPage: 1,
      marketPageSize: 10,
      hotspotPage: 1,
      hotspotPageSize: 10,
      searchQuery: "",
      searchDate: "all",
      searchSource: "all",
      currentMarket: "",
      hotspotKind: "all",
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function safeUrl(url) {
      try {
        const parsed = new URL(url, window.location.href);
        if (parsed.hostname === "www.yt1998.com" && parsed.pathname === "/ytw/second/marketMgr/detail.jsp") {
          return "";
        }
        if (parsed.protocol === "http:" || parsed.protocol === "https:") {
          return parsed.href;
        }
      } catch (error) {
        return "";
      }
      return "";
    }

    function tagClass(tag) {
      if (tag === "上扬" || tag === "走快") return "tag up";
      if (tag === "回落" || tag === "走缓") return "tag down";
      return "tag";
    }

    function deltaClass(value) {
      const number = Number(value);
      if (Number.isNaN(number) || !value) return "delta";
      if (number > 0) return "delta up";
      if (number < 0) return "delta down";
      return "delta";
    }

    function formatDelta(item) {
      if (!item.delta_amount && !item.delta_rate) return "";
      const amount = item.delta_amount ? `${Number(item.delta_amount) > 0 ? "+" : ""}${escapeHtml(item.delta_amount)}` : "--";
      const rate = item.delta_rate ? `${Number(item.delta_rate) > 0 ? "+" : ""}${(Number(item.delta_rate) * 100).toFixed(1)}%` : "--";
      return `<span class="${deltaClass(item.delta_amount)}">涨跌 ${amount} / ${rate}</span>`;
    }

    function renderPriceBreakdown(item) {
      const points = Array.isArray(item.price_points)
        ? item.price_points.filter((point) => point && point.label && point.price)
        : [];

      if (!points.length && !item.price) return "";

      const rows = points.length > 1
        ? points
        : [{ label: "主流报价", price: points[0]?.price || item.price }];

      return `
        <div class="entry-price-breakdown">
          ${rows.map((point) => `
            <div class="price-point">
              <span class="price-point-label">${escapeHtml(point.label)}</span>
              <span class="price-point-value">${escapeHtml(point.price)}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderSourceLinks(item) {
      const sourceLinks = Array.isArray(item.source_links)
        ? item.source_links.filter((entry) => entry && entry.label && safeUrl(entry.url))
        : [];
      if (!sourceLinks.length) {
        const url = safeUrl(item.url);
        return url ? `<a class="entry-link" href="${escapeHtml(url)}" target="_blank" rel="noreferrer">查看来源</a>` : "";
      }
      return `
        <span class="entry-link-list">
          ${sourceLinks.map((entry) => `
            <a class="entry-link" href="${escapeHtml(safeUrl(entry.url))}" target="_blank" rel="noreferrer">${escapeHtml(entry.label)}</a>
          `).join("")}
        </span>
      `;
    }

    function renderEntryCard(item, type, options = {}) {
      const title = type === "hotspot" ? item.title : item.herb;
      const specText = type === "hotspot"
        ? (item.kind || "行业热点")
        : type === "market"
          ? (item.spec || "")
          : (item.spec || "待补规格");
      const spec = specText ? `<span class="entry-spec">${escapeHtml(specText)}</span>` : "";
      const locationLabel = type === "origin" ? "产区" : type === "market" ? "市场" : "关联";
      const location = type === "origin" ? item.location : type === "market" ? item.market : (item.location || "待补");
      const tag = type === "hotspot" ? (item.kind || "行业热点") : (item.tag || "关注");
      const sectionBadge = options.sectionLabel ? `<span class="tag section-tag">${escapeHtml(options.sectionLabel)}</span>` : "";
      const summary = item.summary ? `<p class="entry-summary">${escapeHtml(item.summary)}</p>` : "";
      const hasMultiPricePoints = Array.isArray(item.price_points) && item.price_points.length > 1;
      const price = type === "origin" && item.price && !hasMultiPricePoints ? `<span class="entry-price">${escapeHtml(item.price)}</span>` : "";
      const priceBreakdown = (type === "market" || (type === "origin" && hasMultiPricePoints)) ? renderPriceBreakdown(item) : "";
      const delta = type === "origin" && (item.delta_amount || item.delta_rate) ? formatDelta(item) : "";
      const related = type === "hotspot" && item.herb ? ` · 关联品种：${escapeHtml(item.herb)}` : "";
      const sourceLinks = renderSourceLinks(item);

      return `
        <article class="entry-card">
          <div class="entry-top">
            <span class="entry-date">${escapeHtml(item.date || "--")}</span>
            <div class="entry-badges">
              ${sectionBadge}
              <span class="${type === "hotspot" ? "tag" : tagClass(tag)}">${escapeHtml(tag)}</span>
              ${price}
              ${delta}
            </div>
          </div>
          <div class="entry-title-row">
            <h3 class="entry-title">${escapeHtml(title || "待补标题")}</h3>
            ${spec}
          </div>
          <div class="entry-meta">${locationLabel}：${escapeHtml(location)}${related}</div>
          ${priceBreakdown}
          ${summary}
          <div class="entry-footer">
            <span>来源：${escapeHtml(item.source || "待补来源")}</span>
            ${sourceLinks}
          </div>
        </article>
      `;
    }

    function renderHero(dashboard) {
      document.getElementById("statusPill").textContent = dashboard.status;
      document.getElementById("footerLeft").textContent = dashboard.footer.left;
      document.getElementById("footerRight").textContent = String(dashboard.footer.right || "").replace(/天天行情/g, "市场行情");
    }

    function renderChipGroup(rootId, items, activeValue, onClick) {
      const root = document.getElementById(rootId);
      root.innerHTML = items.map((item) => `
        <button class="filter-chip ${item.value === activeValue ? "active" : ""}" data-value="${escapeHtml(item.value)}" type="button">
          ${escapeHtml(item.label)}
        </button>
      `).join("");
      root.querySelectorAll(".filter-chip").forEach((button) => {
        button.addEventListener("click", () => onClick(button.dataset.value));
      });
    }

    function matchesSearchQuery(query, parts) {
      const keyword = String(query || "").trim().toLowerCase();
      if (!keyword) return false;
      return parts.join(" ").toLowerCase().includes(keyword);
    }

    function filteredOriginItems() {
      if (!state.dashboard) return [];
      return state.dashboard.origin.items || [];
    }

    function latestDate(items) {
      return items
        .map((item) => item.date)
        .filter(Boolean)
        .sort()
        .reverse()[0] || "--";
    }

    function uniqueSources(items) {
      return [...new Set((items || []).map((item) => item.source).filter(Boolean))];
    }

    function collectSearchResults() {
      if (!state.dashboard) return [];
      const query = state.searchQuery;
      const hasFilter = state.searchDate !== "all" || state.searchSource !== "all";
      if (!query.trim() && !hasFilter) return [];

      const results = [];
      const pushMatches = (items, type, sectionLabel) => {
        (items || []).forEach((item) => {
          const dateMatch = state.searchDate === "all" || item.date === state.searchDate;
          const itemSources = Array.isArray(item.source_links) && item.source_links.length
            ? item.source_links.map((entry) => entry.label)
            : String(item.source || "").split("、").map((value) => value.trim()).filter(Boolean);
          const sourceMatch = state.searchSource === "all" || itemSources.includes(state.searchSource) || item.source === state.searchSource;
          if (!dateMatch || !sourceMatch) return;
          const matched = matchesSearchQuery(query, [
            item.title,
            item.herb,
            item.spec,
            item.location,
            item.market,
            item.kind,
            item.summary,
            item.source,
            item.tag,
            item.price,
          ]);
          if (!query.trim() && !hasFilter) return;
          if (query.trim() && !matched) return;
          results.push({
            ...item,
            _searchType: type,
            _searchSection: sectionLabel,
          });
        });
      };

      pushMatches(state.dashboard.origin.items, "origin", "产地行情");
      (state.dashboard.markets.groups || []).forEach((group) => {
        pushMatches(group.items, "market", "市场行情");
      });
      pushMatches(state.dashboard.hotspots.items, "hotspot", "行业热点");

      return results.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
    }

    function applySearch() {
      const input = document.getElementById("globalSearch");
      state.searchQuery = input ? input.value : "";
      renderSearchSection(state.dashboard);
    }

    function renderOriginSection(dashboard) {
      const allItems = filteredOriginItems();
      const totalPages = Math.max(1, Math.ceil(allItems.length / state.originPageSize));
      if (state.originPage > totalPages) state.originPage = totalPages;
      const start = (state.originPage - 1) * state.originPageSize;
      const pageItems = allItems.slice(start, start + state.originPageSize);

      document.getElementById("originCountChip").textContent = `${allItems.length} 条`;

      const root = document.getElementById("originList");
      root.innerHTML = pageItems.length
        ? pageItems.map((item) => renderEntryCard(item, "origin")).join("")
        : `<div class="empty-state">${escapeHtml(dashboard.origin.empty_text)}</div>`;

      document.getElementById("originPageInfo").textContent = `第 ${state.originPage} 页 / 共 ${totalPages} 页`;
      document.getElementById("originPrev").disabled = state.originPage === 1;
      document.getElementById("originNext").disabled = state.originPage === totalPages;
    }

    function renderMarketSection(dashboard) {
      const groups = dashboard.markets.groups || [];
      const targetMarkets = ["亳州", "安国", "玉林"];
      const tabs = targetMarkets.map((name) => {
        const group = groups.find((item) => item.name === name);
        return {
          name,
          items: group?.items || [],
        };
      });
      const totalMatches = tabs.reduce((sum, group) => sum + group.items.length, 0);

      if (!tabs.find((group) => group.name === state.currentMarket)) {
        state.currentMarket = tabs.find((group) => group.items.length)?.name || tabs[0]?.name || "";
      }

      const currentGroup = tabs.find((group) => group.name === state.currentMarket) || tabs[0];

      document.getElementById("marketCountChip").textContent = `${totalMatches} 条`;
      document.getElementById("marketTabs").innerHTML = tabs.map((group) => `
        <button class="market-tab ${group.name === state.currentMarket ? "active" : ""}" type="button" data-market="${escapeHtml(group.name)}">
          ${escapeHtml(group.name)}市场
        </button>
      `).join("");

      document.querySelectorAll(".market-tab").forEach((button) => {
        button.addEventListener("click", () => {
          state.currentMarket = button.dataset.market;
          state.marketPage = 1;
          renderMarketSection(state.dashboard);
        });
      });

      const summary = document.getElementById("marketSummary");
      const list = document.getElementById("marketList");
      const currentItems = currentGroup?.items || [];

      if (!currentGroup || !currentItems.length) {
        summary.textContent = `${state.currentMarket || "该市场"}市场当前还没有录入到真实记录。`;
        list.innerHTML = `<div class="empty-state">${escapeHtml(String(dashboard.markets.empty_text || "").replace(/天天行情/g, "市场行情"))}</div>`;
        document.getElementById("marketPageInfo").textContent = "第 1 页 / 共 1 页";
        document.getElementById("marketPrev").disabled = true;
        document.getElementById("marketNext").disabled = true;
        return;
      }

      const totalPages = Math.max(1, Math.ceil(currentItems.length / state.marketPageSize));
      if (state.marketPage > totalPages) state.marketPage = totalPages;
      const start = (state.marketPage - 1) * state.marketPageSize;
      const pageItems = currentItems.slice(start, start + state.marketPageSize);

      summary.innerHTML = `${escapeHtml(currentGroup.name)}市场当前共 ${escapeHtml(currentItems.length)} 条记录，最新日期为 ${escapeHtml(latestDate(currentItems))}。${uniqueSources(currentItems).length ? ` 来源结构：${escapeHtml(uniqueSources(currentItems).join(" / "))}` : ""}`;
      list.innerHTML = pageItems.map((item) => renderEntryCard(item, "market")).join("");
      document.getElementById("marketPageInfo").textContent = `第 ${state.marketPage} 页 / 共 ${totalPages} 页`;
      document.getElementById("marketPrev").disabled = state.marketPage === 1;
      document.getElementById("marketNext").disabled = state.marketPage === totalPages;
    }

    function renderHotspotSection(dashboard) {
      const items = (dashboard.hotspots.items || []).filter((item) => state.hotspotKind === "all" || item.kind === state.hotspotKind);
      document.getElementById("hotspotCountChip").textContent = `${dashboard.hotspots.total} 条`;

      renderChipGroup(
        "hotspotFilters",
        [{ value: "all", label: "全部类型" }, ...(dashboard.hotspots.kind_options || []).map((value) => ({ value, label: value }))],
        state.hotspotKind,
        (value) => {
          state.hotspotKind = value;
          state.hotspotPage = 1;
          renderHotspotSection(state.dashboard);
        }
      );

      const totalPages = Math.max(1, Math.ceil(items.length / state.hotspotPageSize));
      if (state.hotspotPage > totalPages) state.hotspotPage = totalPages;
      const start = (state.hotspotPage - 1) * state.hotspotPageSize;
      const pageItems = items.slice(start, start + state.hotspotPageSize);

      document.getElementById("hotspotList").innerHTML = items.length
        ? pageItems.map((item) => renderEntryCard(item, "hotspot")).join("")
        : `<div class="empty-state">${escapeHtml(dashboard.hotspots.empty_text)}</div>`;
      document.getElementById("hotspotPageInfo").textContent = `第 ${state.hotspotPage} 页 / 共 ${totalPages} 页`;
      document.getElementById("hotspotPrev").disabled = state.hotspotPage === 1;
      document.getElementById("hotspotNext").disabled = state.hotspotPage === totalPages || items.length === 0;
    }

    function renderSearchSection(dashboard) {
      const query = state.searchQuery.trim();
      const results = collectSearchResults();
      const root = document.getElementById("searchList");
      const meta = document.getElementById("searchMeta");
      const countChip = document.getElementById("searchCountChip");
      const allSearchItems = [
        ...(dashboard.origin.items || []),
        ...((dashboard.markets.groups || []).flatMap((group) => group.items || [])),
        ...(dashboard.hotspots.items || []),
      ];
      const searchDates = [...new Set(allSearchItems.map((item) => item.date).filter(Boolean))].sort().reverse();
      const searchSources = [...new Set(allSearchItems.map((item) => item.source).filter(Boolean))].sort();

      renderChipGroup(
        "searchDateFilters",
        [{ value: "all", label: "全部日期" }, ...searchDates.map((value) => ({ value, label: value }))],
        state.searchDate,
        (value) => {
          state.searchDate = value;
          renderSearchSection(state.dashboard);
        }
      );

      renderChipGroup(
        "searchSourceFilters",
        [{ value: "all", label: "全部来源" }, ...searchSources.map((value) => ({ value, label: value }))],
        state.searchSource,
        (value) => {
          state.searchSource = value;
          renderSearchSection(state.dashboard);
        }
      );

      if (!query && state.searchDate === "all" && state.searchSource === "all") {
        countChip.textContent = "未搜索";
        meta.innerHTML = "";
        root.innerHTML = `<div class="empty-state">输入关键词后，可在这里集中查看产地行情、市场行情和行业热点的匹配结果；也可以先按日期和来源筛选。</div>`;
        return;
      }

      const originCount = results.filter((item) => item._searchSection === "产地行情").length;
      const marketCount = results.filter((item) => item._searchSection === "市场行情").length;
      const hotspotCount = results.filter((item) => item._searchSection === "行业热点").length;

      countChip.textContent = `${results.length} 条`;
      meta.innerHTML = [
        query ? `<span class="metric-chip active">关键词：${escapeHtml(query)}</span>` : `<span class="metric-chip active">按筛选条件查看</span>`,
        `<span class="metric-chip">产地行情 ${originCount} 条</span>`,
        `<span class="metric-chip">市场行情 ${marketCount} 条</span>`,
        `<span class="metric-chip">行业热点 ${hotspotCount} 条</span>`,
      ].filter(Boolean).join("");

      root.innerHTML = results.length
        ? results.map((item) => renderEntryCard(item, item._searchType, { sectionLabel: item._searchSection })).join("")
        : `<div class="empty-state">没有找到符合当前检索条件的内容。</div>`;
    }

    function renderFailure(message) {
      document.getElementById("statusPill").textContent = "数据加载失败";
      document.getElementById("originList").innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
      document.getElementById("marketList").innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
      document.getElementById("hotspotList").innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
      document.getElementById("searchList").innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
      document.getElementById("footerRight").textContent = "请确认 public/data/dashboard.json 已生成。";
    }

    async function loadSiteVisits() {
      const footerTraffic = document.getElementById("footerTraffic");
      try {
        const response = await fetch("https://bsz.saop.cc/api", {
          method: "POST",
          credentials: "include",
          headers: {
            "x-bsz-referer": `${window.location.origin}/`,
          },
        });
        if (!response.ok) throw new Error(`Failed to load site visits: ${response.status}`);
        const payload = await response.json();
        if (!payload.success || !payload.data) throw new Error("Invalid site visits payload");
        footerTraffic.textContent = `本站总访问量 ${Number(payload.data.site_pv || 0).toLocaleString("zh-CN")} 次`;
      } catch (error) {
        console.error(error);
        footerTraffic.textContent = "本站总访问量 -- 次";
      }
    }

    async function loadDashboard() {
      try {
        const response = await fetch("./data/dashboard.json");
        if (!response.ok) throw new Error(`Failed to load dashboard.json: ${response.status}`);
        state.dashboard = await response.json();
        state.currentMarket = (state.dashboard.markets.groups || []).find((group) => group.count > 0)?.name || "";
        renderHero(state.dashboard);
        renderOriginSection(state.dashboard);
        renderMarketSection(state.dashboard);
        renderHotspotSection(state.dashboard);
        renderSearchSection(state.dashboard);

        document.getElementById("globalSearch").addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            applySearch();
          }
        });

        document.getElementById("globalSearchSubmit").addEventListener("click", () => {
          applySearch();
        });

        document.getElementById("originPrev").addEventListener("click", () => {
          if (state.originPage > 1) {
            state.originPage -= 1;
            renderOriginSection(state.dashboard);
          }
        });

        document.getElementById("originNext").addEventListener("click", () => {
          const totalPages = Math.max(1, Math.ceil(filteredOriginItems().length / state.originPageSize));
          if (state.originPage < totalPages) {
            state.originPage += 1;
            renderOriginSection(state.dashboard);
          }
        });

        document.getElementById("marketPrev").addEventListener("click", () => {
          if (state.marketPage > 1) {
            state.marketPage -= 1;
            renderMarketSection(state.dashboard);
          }
        });

        document.getElementById("marketNext").addEventListener("click", () => {
          const groups = state.dashboard.markets.groups || [];
          const currentGroup = groups.find((group) => group.name === state.currentMarket) || groups[0] || { items: [] };
          const totalPages = Math.max(1, Math.ceil((currentGroup.items || []).length / state.marketPageSize));
          if (state.marketPage < totalPages) {
            state.marketPage += 1;
            renderMarketSection(state.dashboard);
          }
        });

        document.getElementById("hotspotPrev").addEventListener("click", () => {
          if (state.hotspotPage > 1) {
            state.hotspotPage -= 1;
            renderHotspotSection(state.dashboard);
          }
        });

        document.getElementById("hotspotNext").addEventListener("click", () => {
          const items = (state.dashboard.hotspots.items || []).filter((item) => state.hotspotKind === "all" || item.kind === state.hotspotKind);
          const totalPages = Math.max(1, Math.ceil(items.length / state.hotspotPageSize));
          if (state.hotspotPage < totalPages) {
            state.hotspotPage += 1;
            renderHotspotSection(state.dashboard);
          }
        });
      } catch (error) {
        console.error(error);
        renderFailure("当前没有读到 dashboard.json，请先运行数据生成脚本。");
      }
    }

    loadSiteVisits();
    loadDashboard();
  </script>
</body>
</html>
