<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中药材全国追踪</title>
  <style>
    :root {
      --bg: #10251f;
      --bg-deep: #0a1915;
      --paper: rgba(247, 240, 223, 0.95);
      --paper-strong: rgba(250, 244, 231, 0.98);
      --paper-soft: rgba(241, 232, 209, 0.8);
      --ink: #213127;
      --ink-soft: #5c6d61;
      --line: rgba(40, 82, 59, 0.16);
      --line-strong: rgba(40, 82, 59, 0.3);
      --green: #2f6b4e;
      --green-deep: #1d4c37;
      --gold: #b88538;
      --gold-soft: #e5c58e;
      --rose: #a85844;
      --shadow: 0 30px 80px rgba(7, 21, 16, 0.28);
      --radius-lg: 30px;
      --radius-md: 22px;
      --radius-sm: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(229, 197, 142, 0.12), transparent 24%),
        radial-gradient(circle at 85% 12%, rgba(112, 155, 122, 0.18), transparent 22%),
        linear-gradient(180deg, #112820 0%, #0d1d18 46%, #09120f 100%);
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 30px 30px;
      opacity: 0.25;
    }

    .shell {
      width: min(1260px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 56px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 20px 4px 26px;
      color: #f4ead6;
      text-align: center;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 0;
      max-width: 980px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(38px, 5vw, 64px);
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    .brand p {
      margin: 0;
      color: rgba(244, 234, 214, 0.74);
      font-size: clamp(17px, 2.2vw, 22px);
      line-height: 1.75;
      max-width: 880px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1px solid rgba(229, 197, 142, 0.2);
      background: rgba(244, 234, 214, 0.08);
      color: #f8efdb;
      font-size: 13px;
      white-space: nowrap;
    }

    .status-pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #7bb38d;
      box-shadow: 0 0 0 0 rgba(123, 179, 141, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(123, 179, 141, 0.58); }
      70% { box-shadow: 0 0 0 14px rgba(123, 179, 141, 0); }
      100% { box-shadow: 0 0 0 0 rgba(123, 179, 141, 0); }
    }

    .panel {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 247, 232, 0.14);
      box-shadow: var(--shadow);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(229, 197, 142, 0.78), transparent);
      opacity: 0.6;
      pointer-events: none;
    }

    .hero {
      display: block;
      background:
        radial-gradient(circle at 18% 12%, rgba(229, 197, 142, 0.14), transparent 24%),
        linear-gradient(135deg, rgba(18, 42, 33, 0.98), rgba(14, 30, 24, 0.98));
      margin-bottom: 22px;
    }

    .hero-copy {
      padding: 30px 34px;
      color: #f6eddb;
    }

    .hero-card {
      padding: 30px 32px;
      border-radius: 28px;
      border: 1px solid rgba(247, 240, 223, 0.1);
      background: rgba(247, 240, 223, 0.04);
      max-width: 1100px;
      margin: 0 auto;
      text-align: center;
    }

    .hero-title {
      margin: 0 0 12px;
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      font-size: clamp(30px, 4.2vw, 48px);
      line-height: 1.18;
      letter-spacing: -0.04em;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
      justify-content: center;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 144px;
      padding: 13px 18px;
      border-radius: 999px;
      border: 1px solid rgba(247, 240, 223, 0.14);
      color: #f8efdb;
      text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      background: rgba(247, 240, 223, 0.06);
      font-size: 14px;
      font-weight: 600;
    }

    .button:hover {
      transform: translateY(-1px);
      border-color: rgba(229, 197, 142, 0.42);
      background: rgba(247, 240, 223, 0.1);
    }

    .button.primary {
      color: #1b3327;
      background: linear-gradient(135deg, #e7c789, #f6e7c7);
      border-color: transparent;
    }

    .button.trace {
      color: #fff3d6;
      border-color: rgba(229, 197, 142, 0.34);
      background: rgba(184, 133, 56, 0.16);
      min-width: 260px;
      min-height: 72px;
      padding: 18px 30px;
      font-size: 24px;
      font-weight: 700;
    }

    .hero-note-title {
      margin: 14px 0 8px;
      font-size: 18px;
      color: #f6e8c6;
      font-weight: 700;
    }

    .hero-note {
      margin: 0;
      color: rgba(246, 237, 219, 0.78);
      font-size: 14px;
      line-height: 1.8;
    }

    .global-search {
      margin-bottom: 18px;
      background: rgba(247, 240, 223, 0.9);
    }

    .global-search-body {
      padding: 18px 22px;
    }

    .global-search-box {
      max-width: 980px;
      margin: 0 auto;
      min-height: 58px;
      background: rgba(255, 255, 255, 0.72);
    }

    .source-chip,
    .filter-chip,
    .metric-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.02);
    }

    .source-chip {
      color: #eadbbd;
      border-color: rgba(247, 240, 223, 0.12);
      background: rgba(247, 240, 223, 0.05);
    }

    .quick-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
      position: sticky;
      top: 14px;
      z-index: 4;
      justify-content: center;
    }

    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 999px;
      text-decoration: none;
      color: #f7efdf;
      border: 1px solid rgba(247, 240, 223, 0.12);
      background: rgba(9, 19, 15, 0.64);
      backdrop-filter: blur(12px);
      transition: transform 0.18s ease, border-color 0.18s ease;
      font-size: 14px;
    }

    .nav-pill:hover {
      transform: translateY(-1px);
      border-color: rgba(229, 197, 142, 0.36);
    }

    .section {
      margin-bottom: 20px;
      background: var(--paper);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 26px 28px 20px;
      border-bottom: 1px solid rgba(44, 78, 59, 0.08);
    }

    .section-title {
      margin: 0;
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      font-size: 30px;
      line-height: 1.2;
    }

    .count-chip {
      flex-shrink: 0;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(47, 107, 78, 0.08);
      color: var(--green-deep);
      border: 1px solid rgba(47, 107, 78, 0.14);
      font-size: 13px;
      font-weight: 700;
    }

    .section-body {
      padding: 20px 22px 26px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: minmax(240px, 1.15fr) 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border-radius: 18px;
      border: 1px solid rgba(44, 78, 59, 0.12);
      background: rgba(255, 255, 255, 0.58);
      min-height: 52px;
    }

    .search-box span {
      color: var(--green);
      font-size: 16px;
    }

    .search-input {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      outline: none;
    }

    .search-input::placeholder {
      color: #89968b;
    }

    .filter-group,
    .meta-row,
    .market-meta,
    .hotspot-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-group {
      align-items: center;
      justify-content: flex-end;
    }

    .filter-chip,
    .metric-chip {
      color: var(--ink-soft);
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      user-select: none;
    }

    .filter-chip:hover,
    .metric-chip:hover {
      transform: translateY(-1px);
      border-color: rgba(47, 107, 78, 0.28);
    }

    .filter-chip.active,
    .metric-chip.active {
      color: var(--green-deep);
      border-color: rgba(47, 107, 78, 0.28);
      background: rgba(47, 107, 78, 0.09);
    }

    .meta-row {
      margin-bottom: 16px;
    }

    .entry-list {
      display: grid;
      gap: 10px;
    }

    .entry-card {
      padding: 16px;
      border-radius: 20px;
      border: 1px solid rgba(44, 78, 59, 0.08);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.44), rgba(255, 255, 255, 0.18)),
        var(--paper-strong);
      animation: rise 0.4s ease;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .entry-top,
    .entry-title-row,
    .entry-footer,
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .entry-date {
      color: var(--ink-soft);
      font-size: 12px;
    }

    .entry-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: var(--green-deep);
      background: rgba(47, 107, 78, 0.1);
    }

    .tag.up {
      color: #8d4d2e;
      background: rgba(184, 133, 56, 0.14);
    }

    .tag.down {
      color: var(--rose);
      background: rgba(168, 88, 68, 0.12);
    }

    .entry-price {
      color: var(--gold);
      font-size: 14px;
      font-weight: 700;
    }

    .entry-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.22;
      font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    }

    .entry-spec {
      color: var(--green);
      font-size: 13px;
      font-weight: 600;
    }

    .entry-meta {
      margin-top: 8px;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.65;
    }

    .entry-summary {
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 1.65;
      color: var(--ink);
    }

    .entry-footer {
      margin-top: 10px;
      color: var(--ink-soft);
      font-size: 12px;
    }

    .entry-link {
      color: var(--green);
      text-decoration: none;
      font-weight: 700;
    }

    .entry-link:hover {
      text-decoration: underline;
    }

    .delta {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(47, 107, 78, 0.08);
      color: var(--green-deep);
    }

    .delta.up {
      background: rgba(184, 133, 56, 0.14);
      color: #8d4d2e;
    }

    .delta.down {
      background: rgba(168, 88, 68, 0.12);
      color: var(--rose);
    }

    .pager {
      margin-top: 16px;
    }

    .pager-info {
      color: var(--ink-soft);
      font-size: 14px;
    }

    .pager-button {
      min-width: 112px;
      padding: 11px 15px;
      border-radius: 14px;
      border: 1px solid rgba(44, 78, 59, 0.14);
      background: rgba(255, 255, 255, 0.5);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease, border-color 0.18s ease;
    }

    .pager-button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(47, 107, 78, 0.28);
    }

    .pager-button:disabled {
      opacity: 0.36;
      cursor: not-allowed;
    }

    .market-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      justify-content: center;
    }

    .market-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1px solid rgba(44, 78, 59, 0.14);
      background: rgba(255, 255, 255, 0.52);
      color: var(--ink-soft);
      cursor: pointer;
      font: inherit;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .market-tab:hover {
      transform: translateY(-1px);
      border-color: rgba(47, 107, 78, 0.28);
    }

    .market-tab.active {
      color: #fff8eb;
      background: linear-gradient(135deg, var(--green), #47795b);
      border-color: transparent;
    }

    .market-summary {
      margin-bottom: 16px;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.85;
      text-align: center;
    }

    .empty-state {
      padding: 22px;
      border-radius: 22px;
      border: 1px dashed rgba(44, 78, 59, 0.18);
      color: var(--ink-soft);
      background: rgba(255, 255, 255, 0.38);
      font-size: 15px;
      line-height: 1.9;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 8px 6px 0;
      color: rgba(244, 234, 214, 0.8);
      font-size: 13px;
    }

    .footer-traffic {
      width: 100%;
      text-align: center;
      color: rgba(244, 234, 214, 0.88);
      font-size: 15px;
      letter-spacing: 0.02em;
    }

    .muted {
      color: var(--ink-soft);
    }

    @media (max-width: 1024px) {
      .control-grid {
        grid-template-columns: 1fr;
      }

      .filter-group {
        justify-content: flex-start;
      }
    }

    @media (max-width: 720px) {
      .shell {
        width: min(100%, calc(100% - 18px));
        padding-top: 18px;
      }

      .topbar {
        align-items: center;
        flex-direction: column;
        padding-bottom: 18px;
        text-align: center;
      }

      .hero-copy,
      .hero-copy {
        padding: 24px 18px 20px;
      }

      .global-search-body {
        padding: 16px 14px;
      }

      .hero-title {
        font-size: clamp(28px, 9vw, 42px);
      }

      .hero-card {
        padding: 20px 16px;
      }

      .button.trace {
        width: 100%;
        min-width: 0;
        min-height: 58px;
        font-size: 19px;
      }

      .section-head {
        padding: 18px 16px 14px;
      }

      .section-body {
        padding: 14px 12px 18px;
      }

      .section-title {
        font-size: 24px;
      }

      .entry-title {
        font-size: 18px;
      }

      .entry-card {
        padding: 13px 12px;
        border-radius: 18px;
      }

      .entry-list {
        gap: 8px;
      }

      .entry-top,
      .entry-title-row,
      .entry-footer {
        gap: 8px;
      }

      .entry-date,
      .entry-spec,
      .entry-meta,
      .entry-footer {
        font-size: 12px;
      }

      .entry-summary {
        margin-top: 8px;
        font-size: 13px;
        line-height: 1.55;
      }

      .entry-meta {
        margin-top: 6px;
        line-height: 1.5;
      }

      .tag,
      .delta {
        padding: 4px 8px;
        font-size: 11px;
      }

      .entry-price {
        font-size: 13px;
      }

      .quick-nav {
        top: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <h1>中药材全国追踪</h1>
        <p>聚合产地行情、市场动态与行业快讯的一站式中药材信息情报中心。</p>
      </div>
      <div class="status-pill" id="statusPill">正在读取数据</div>
    </header>

    <section class="hero panel">
      <div class="hero-copy">
        <article class="hero-card">
          <h2 class="hero-title">曹操溯源平台</h2>
          <div class="hero-actions">
            <a class="button primary trace" href="https://ahsynl.com" target="_blank" rel="noreferrer">进入溯源平台</a>
          </div>
          <h3 class="hero-note-title">免责说明</h3>
          <p class="hero-note">本站用于集中整理中药材公开行情与行业线索，方便快速查看与跟踪。页面内容仅供信息参考，可能存在延迟、误差或缺漏。</p>
        </article>
      </div>
    </section>

    <section class="global-search panel">
      <div class="global-search-body">
        <label class="search-box global-search-box">
          <span>全站检索</span>
          <input class="search-input" id="globalSearch" type="search" placeholder="搜索产地行情、天天行情、行业热点">
        </label>
      </div>
    </section>

    <nav class="quick-nav">
      <a class="nav-pill" href="#originSection">1. 产地行情</a>
      <a class="nav-pill" href="#marketSection">2. 天天行情</a>
      <a class="nav-pill" href="#hotspotSection">3. 行业热点</a>
    </nav>

    <section class="section panel" id="originSection">
      <div class="section-head">
        <div>
          <h2 class="section-title">产地行情</h2>
        </div>
        <div class="count-chip" id="originCountChip">0 条</div>
      </div>
      <div class="section-body">
        <div class="filter-group" id="originDateFilters" style="justify-content:flex-start; margin-bottom: 16px;"></div>
        <div class="filter-group" id="originSourceFilters" style="justify-content:flex-start; margin-bottom: 16px;"></div>
        <div class="meta-row" id="originMeta"></div>
        <div class="entry-list" id="originList"></div>
        <div class="pager">
          <button class="pager-button" id="originPrev">上一页</button>
          <div class="pager-info" id="originPageInfo">第 1 页 / 共 1 页</div>
          <button class="pager-button" id="originNext">下一页</button>
        </div>
      </div>
    </section>

    <section class="section panel" id="marketSection">
      <div class="section-head">
        <div>
          <h2 class="section-title">天天行情</h2>
        </div>
        <div class="count-chip" id="marketCountChip">0 条</div>
      </div>
      <div class="section-body">
        <div class="market-tabs" id="marketTabs"></div>
        <div class="market-summary" id="marketSummary"></div>
        <div class="entry-list" id="marketList"></div>
      </div>
    </section>

    <section class="section panel" id="hotspotSection">
      <div class="section-head">
        <div>
          <h2 class="section-title">行业热点</h2>
        </div>
        <div class="count-chip" id="hotspotCountChip">0 条</div>
      </div>
      <div class="section-body">
        <div class="hotspot-filters" id="hotspotFilters" style="margin-bottom:16px;"></div>
        <div class="entry-list" id="hotspotList"></div>
      </div>
    </section>

    <footer class="footer">
      <div id="footerLeft">数据文件：--</div>
      <div id="footerRight">站点结构已兼容后续继续补药通网天天行情与行业热点。</div>
      <div class="footer-traffic" id="footerTraffic">本站总访问量 -- 次</div>
    </footer>
  </main>

  <script>
    const state = {
      dashboard: null,
      originPage: 1,
      originPageSize: 10,
      globalQuery: "",
      originDate: "all",
      originSource: "all",
      currentMarket: "",
      hotspotKind: "all",
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function safeUrl(url) {
      try {
        const parsed = new URL(url, window.location.href);
        if (parsed.protocol === "http:" || parsed.protocol === "https:") {
          return parsed.href;
        }
      } catch (error) {
        return "";
      }
      return "";
    }

    function tagClass(tag) {
      if (tag === "上扬" || tag === "走快") return "tag up";
      if (tag === "回落" || tag === "走缓") return "tag down";
      return "tag";
    }

    function deltaClass(value) {
      const number = Number(value);
      if (Number.isNaN(number) || !value) return "delta";
      if (number > 0) return "delta up";
      if (number < 0) return "delta down";
      return "delta";
    }

    function formatDelta(item) {
      if (!item.delta_amount && !item.delta_rate) return "";
      const amount = item.delta_amount ? `${Number(item.delta_amount) > 0 ? "+" : ""}${escapeHtml(item.delta_amount)}` : "--";
      const rate = item.delta_rate ? `${Number(item.delta_rate) > 0 ? "+" : ""}${(Number(item.delta_rate) * 100).toFixed(1)}%` : "--";
      return `<span class="${deltaClass(item.delta_amount)}">涨跌 ${amount} / ${rate}</span>`;
    }

    function renderEntryCard(item, type) {
      const title = type === "hotspot" ? item.title : item.herb;
      const spec = type === "hotspot" ? (item.kind || "行业热点") : (item.spec || "待补规格");
      const locationLabel = type === "origin" ? "产区" : type === "market" ? "市场" : "关联";
      const location = type === "origin" ? item.location : type === "market" ? item.market : (item.location || "待补");
      const tag = type === "hotspot" ? (item.kind || "行业热点") : (item.tag || "关注");
      const summary = item.summary ? `<p class="entry-summary">${escapeHtml(item.summary)}</p>` : "";
      const price = type === "hotspot" || !item.price ? "" : `<span class="entry-price">${escapeHtml(item.price)}</span>`;
      const delta = type === "origin" && (item.delta_amount || item.delta_rate) ? formatDelta(item) : "";
      const related = type === "hotspot" && item.herb ? ` · 关联品种：${escapeHtml(item.herb)}` : "";
      const url = safeUrl(item.url);

      return `
        <article class="entry-card">
          <div class="entry-top">
            <span class="entry-date">${escapeHtml(item.date || "--")}</span>
            <div class="entry-badges">
              <span class="${type === "hotspot" ? "tag" : tagClass(tag)}">${escapeHtml(tag)}</span>
              ${price}
              ${delta}
            </div>
          </div>
          <div class="entry-title-row">
            <h3 class="entry-title">${escapeHtml(title || "待补标题")}</h3>
            <span class="entry-spec">${escapeHtml(spec)}</span>
          </div>
          <div class="entry-meta">${locationLabel}：${escapeHtml(location)}${related}</div>
          ${summary}
          <div class="entry-footer">
            <span>来源：${escapeHtml(item.source || "待补来源")}</span>
            ${url ? `<a class="entry-link" href="${escapeHtml(url)}" target="_blank" rel="noreferrer">查看来源</a>` : ""}
          </div>
        </article>
      `;
    }

    function renderHero(dashboard) {
      document.getElementById("statusPill").textContent = dashboard.status;
      document.getElementById("footerLeft").textContent = dashboard.footer.left;
      document.getElementById("footerRight").textContent = dashboard.footer.right;
    }

    function renderChipGroup(rootId, items, activeValue, onClick) {
      const root = document.getElementById(rootId);
      root.innerHTML = items.map((item) => `
        <button class="filter-chip ${item.value === activeValue ? "active" : ""}" data-value="${escapeHtml(item.value)}" type="button">
          ${escapeHtml(item.label)}
        </button>
      `).join("");
      root.querySelectorAll(".filter-chip").forEach((button) => {
        button.addEventListener("click", () => onClick(button.dataset.value));
      });
    }

    function matchesGlobalQuery(parts) {
      const query = state.globalQuery.trim().toLowerCase();
      if (!query) return true;
      return parts.join(" ").toLowerCase().includes(query);
    }

    function filteredOriginItems() {
      if (!state.dashboard) return [];
      return (state.dashboard.origin.items || []).filter((item) => {
        const dateMatch = state.originDate === "all" || item.date === state.originDate;
        const sourceMatch = state.originSource === "all" || item.source === state.originSource;
        const queryMatch = matchesGlobalQuery([item.herb, item.spec, item.location, item.summary, item.source, item.tag, item.price]);
        return dateMatch && sourceMatch && queryMatch;
      });
    }

    function filterMarketItems(items) {
      return (items || []).filter((item) => matchesGlobalQuery([item.herb, item.spec, item.market, item.summary, item.source, item.tag, item.price]));
    }

    function filteredHotspotItems() {
      if (!state.dashboard) return [];
      return (state.dashboard.hotspots.items || []).filter((item) => {
        const kindMatch = state.hotspotKind === "all" || item.kind === state.hotspotKind;
        const queryMatch = matchesGlobalQuery([item.title, item.herb, item.kind, item.location, item.summary, item.source]);
        return kindMatch && queryMatch;
      });
    }

    function latestDate(items) {
      return items
        .map((item) => item.date)
        .filter(Boolean)
        .sort()
        .reverse()[0] || "--";
    }

    function uniqueSources(items) {
      return [...new Set((items || []).map((item) => item.source).filter(Boolean))];
    }

    function renderOriginSection(dashboard) {
      const allItems = filteredOriginItems();
      const totalPages = Math.max(1, Math.ceil(allItems.length / state.originPageSize));
      if (state.originPage > totalPages) state.originPage = totalPages;
      const start = (state.originPage - 1) * state.originPageSize;
      const pageItems = allItems.slice(start, start + state.originPageSize);

      renderChipGroup(
        "originDateFilters",
        [{ value: "all", label: "全部日期" }, ...(dashboard.origin.date_options || []).map((value) => ({ value, label: value }))],
        state.originDate,
        (value) => {
          state.originDate = value;
          state.originPage = 1;
          renderOriginSection(state.dashboard);
        }
      );

      renderChipGroup(
        "originSourceFilters",
        [{ value: "all", label: "全部来源" }, ...(dashboard.origin.source_options || []).map((value) => ({ value, label: value }))],
        state.originSource,
        (value) => {
          state.originSource = value;
          state.originPage = 1;
          renderOriginSection(state.dashboard);
        }
      );

      document.getElementById("originCountChip").textContent = `${allItems.length} 条`;
      document.getElementById("originMeta").innerHTML = [
        `<span class="metric-chip active">总产地记录 ${escapeHtml(dashboard.origin.total)} 条</span>`,
        `<span class="metric-chip">最新日期 ${escapeHtml(dashboard.origin.latest_date || "--")}</span>`,
        `<span class="metric-chip">当前页 ${escapeHtml(pageItems.length)} 条</span>`,
      ].join("");

      const root = document.getElementById("originList");
      root.innerHTML = pageItems.length
        ? pageItems.map((item) => renderEntryCard(item, "origin")).join("")
        : `<div class="empty-state">${escapeHtml(dashboard.origin.empty_text)}</div>`;

      document.getElementById("originPageInfo").textContent = `第 ${state.originPage} 页 / 共 ${totalPages} 页`;
      document.getElementById("originPrev").disabled = state.originPage === 1;
      document.getElementById("originNext").disabled = state.originPage === totalPages;
    }

    function renderMarketSection(dashboard) {
      const groups = dashboard.markets.groups || [];
      const targetMarkets = ["亳州", "安国", "玉林"];
      const tabs = targetMarkets.map((name) => {
        const group = groups.find((item) => item.name === name);
        return {
          name,
          items: group?.items || [],
        };
      });
      const totalMatches = tabs.reduce((sum, group) => sum + filterMarketItems(group.items).length, 0);

      if (!tabs.find((group) => group.name === state.currentMarket)) {
        state.currentMarket = tabs[0]?.name || "";
      }

      let currentGroup = tabs.find((group) => group.name === state.currentMarket) || tabs[0];
      if (currentGroup && !filterMarketItems(currentGroup.items).length) {
        currentGroup = tabs.find((group) => filterMarketItems(group.items).length) || currentGroup;
        state.currentMarket = currentGroup?.name || "";
      }

      document.getElementById("marketCountChip").textContent = `${totalMatches} 条`;
      document.getElementById("marketTabs").innerHTML = tabs.map((group) => `
        <button class="market-tab ${group.name === state.currentMarket ? "active" : ""}" type="button" data-market="${escapeHtml(group.name)}">
          ${escapeHtml(group.name)}市场
        </button>
      `).join("");

      document.querySelectorAll(".market-tab").forEach((button) => {
        button.addEventListener("click", () => {
          state.currentMarket = button.dataset.market;
          renderMarketSection(state.dashboard);
        });
      });

      const summary = document.getElementById("marketSummary");
      const list = document.getElementById("marketList");
      const currentItems = filterMarketItems(currentGroup?.items || []);

      if (!currentGroup || !currentItems.length) {
        summary.textContent = state.globalQuery.trim()
          ? `${state.currentMarket || "该市场"}市场暂无匹配“${state.globalQuery}”的记录。`
          : `${state.currentMarket || "该市场"}市场当前还没有录入到真实记录。`;
        list.innerHTML = `<div class="empty-state">${escapeHtml(state.globalQuery.trim() ? `没有找到与“${state.globalQuery}”相关的天天行情记录。` : dashboard.markets.empty_text)}</div>`;
        return;
      }

      summary.innerHTML = `${escapeHtml(currentGroup.name)}市场当前共 ${escapeHtml(currentItems.length)} 条记录，最新日期为 ${escapeHtml(latestDate(currentItems))}。${uniqueSources(currentItems).length ? ` 来源结构：${escapeHtml(uniqueSources(currentItems).join(" / "))}` : ""}`;
      list.innerHTML = currentItems.map((item) => renderEntryCard(item, "market")).join("");
    }

    function renderHotspotSection(dashboard) {
      const items = filteredHotspotItems();
      document.getElementById("hotspotCountChip").textContent = `${items.length} 条`;

      renderChipGroup(
        "hotspotFilters",
        [{ value: "all", label: "全部类型" }, ...(dashboard.hotspots.kind_options || []).map((value) => ({ value, label: value }))],
        state.hotspotKind,
        (value) => {
          state.hotspotKind = value;
          renderHotspotSection(state.dashboard);
        }
      );

      document.getElementById("hotspotList").innerHTML = items.length
        ? items.map((item) => renderEntryCard(item, "hotspot")).join("")
        : `<div class="empty-state">${escapeHtml(dashboard.hotspots.empty_text)}</div>`;
    }

    function renderFailure(message) {
      document.getElementById("statusPill").textContent = "数据加载失败";
      document.getElementById("originList").innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
      document.getElementById("marketList").innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
      document.getElementById("hotspotList").innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
      document.getElementById("footerRight").textContent = "请确认 public/data/dashboard.json 已生成。";
    }

    async function loadSiteVisits() {
      const footerTraffic = document.getElementById("footerTraffic");
      try {
        const response = await fetch("https://bsz.saop.cc/api", {
          method: "POST",
          credentials: "include",
          headers: {
            "x-bsz-referer": `${window.location.origin}/`,
          },
        });
        if (!response.ok) throw new Error(`Failed to load site visits: ${response.status}`);
        const payload = await response.json();
        if (!payload.success || !payload.data) throw new Error("Invalid site visits payload");
        footerTraffic.textContent = `本站总访问量 ${Number(payload.data.site_pv || 0).toLocaleString("zh-CN")} 次`;
      } catch (error) {
        console.error(error);
        footerTraffic.textContent = "本站总访问量 -- 次";
      }
    }

    async function loadDashboard() {
      try {
        const response = await fetch("./data/dashboard.json");
        if (!response.ok) throw new Error(`Failed to load dashboard.json: ${response.status}`);
        state.dashboard = await response.json();
        state.currentMarket = (state.dashboard.markets.groups || []).find((group) => group.count > 0)?.name || "";
        renderHero(state.dashboard);
        renderOriginSection(state.dashboard);
        renderMarketSection(state.dashboard);
        renderHotspotSection(state.dashboard);

        document.getElementById("globalSearch").addEventListener("input", (event) => {
          state.globalQuery = event.target.value;
          state.originPage = 1;
          renderOriginSection(state.dashboard);
          renderMarketSection(state.dashboard);
          renderHotspotSection(state.dashboard);
        });

        document.getElementById("originPrev").addEventListener("click", () => {
          if (state.originPage > 1) {
            state.originPage -= 1;
            renderOriginSection(state.dashboard);
          }
        });

        document.getElementById("originNext").addEventListener("click", () => {
          const totalPages = Math.max(1, Math.ceil(filteredOriginItems().length / state.originPageSize));
          if (state.originPage < totalPages) {
            state.originPage += 1;
            renderOriginSection(state.dashboard);
          }
        });
      } catch (error) {
        console.error(error);
        renderFailure("当前没有读到 dashboard.json，请先运行数据生成脚本。");
      }
    }

    loadSiteVisits();
    loadDashboard();
  </script>
</body>
</html>
